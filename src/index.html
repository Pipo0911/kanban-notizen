<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kanban Notizen</title>
<style>
/* Layout: Seitenleiste (Heute, Zeit, Spaces) · rechts Spalten-Board mit farbigen Notizkarten */
:root{
  --bg:#fbfaf8;--side:#f3f2ef;--surface:#fff;--col:#efeeea;--text:#1f2430;--text2:#4a5060;--muted:#727786;--border:#dedcd6;
  --accent:#2f5bd3;--accent-h:#2449ad;--accent-soft:#e8eefc;--on-accent:#fff;--danger:#c5372c;--danger-soft:#fcebe9;--warn:#9a4d00;--warn-soft:#fff1e3;--ok:#1f7a4d;--ok-soft:#e1f5e8;
  --hover:rgba(31,36,48,.05);--hover2:rgba(31,36,48,.1);
  --toast-bg:#1f2430;--toast-fg:#fff;--toast-link:#9fb8ff;
  --shadow:0 1px 2px rgba(31,36,48,.12),0 0 0 1px rgba(31,36,48,.05);
  --shadow-h:0 3px 10px rgba(31,36,48,.14),0 0 0 1px rgba(31,36,48,.08);
  --shadow-l:0 12px 32px rgba(31,36,48,.22),0 0 0 1px rgba(31,36,48,.06);
  --n-default:#ffffff;--n-yellow:#fff6cf;--n-green:#e1f5e8;--n-blue:#e3edff;--n-pink:#fde6f1;--n-purple:#eee9ff;--n-orange:#ffeadb;--n-grey:#eceae5;
  --font:"Segoe UI Variable Text","Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"Cascadia Mono",ui-monospace,Consolas,"Liberation Mono",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#1a1c21;--side:#16181c;--surface:#24272e;--col:#202329;--text:#e3e5ea;--text2:#bfc3cc;--muted:#8f95a3;--border:#363a44;
  --accent:#7fa2ff;--accent-h:#a3bcff;--accent-soft:#25304d;--on-accent:#10162a;--danger:#f2786d;--danger-soft:#3e2422;--warn:#f5ad6b;--warn-soft:#3b2c1d;--ok:#6fd3a0;--ok-soft:#1e3328;
  --hover:rgba(227,229,234,.06);--hover2:rgba(227,229,234,.12);
  --toast-bg:#e3e5ea;--toast-fg:#1a1c21;--toast-link:#2f5bd3;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.04);--shadow-h:0 3px 10px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.08);--shadow-l:0 12px 32px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06);
  --n-default:#24272e;--n-yellow:#3a341c;--n-green:#1e3328;--n-blue:#1f2b44;--n-pink:#3a2130;--n-purple:#2c2742;--n-orange:#3b2a1d;--n-grey:#2d3038;}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#1a1c21;--side:#16181c;--surface:#24272e;--col:#202329;--text:#e3e5ea;--text2:#bfc3cc;--muted:#8f95a3;--border:#363a44;
  --accent:#7fa2ff;--accent-h:#a3bcff;--accent-soft:#25304d;--on-accent:#10162a;--danger:#f2786d;--danger-soft:#3e2422;--warn:#f5ad6b;--warn-soft:#3b2c1d;--ok:#6fd3a0;--ok-soft:#1e3328;
  --hover:rgba(227,229,234,.06);--hover2:rgba(227,229,234,.12);
  --toast-bg:#e3e5ea;--toast-fg:#1a1c21;--toast-link:#2f5bd3;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.04);--shadow-h:0 3px 10px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.08);--shadow-l:0 12px 32px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06);
  --n-default:#24272e;--n-yellow:#3a341c;--n-green:#1e3328;--n-blue:#1f2b44;--n-pink:#3a2130;--n-purple:#2c2742;--n-orange:#3b2a1d;--n-grey:#2d3038;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 var(--font)}
body.is-dragging{user-select:none;cursor:grabbing}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.4}
input,select,textarea{background:var(--surface);border:1.5px solid var(--border);border-radius:6px;padding:6px 9px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=checkbox]{padding:0;accent-color:var(--accent);width:16px;height:16px;flex:none}
small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
kbd{border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:11.5px;font-family:inherit;background:var(--surface);white-space:nowrap}
[hidden]{display:none!important}
.muted{color:var(--muted)}.sm{font-size:12px}.spacer{flex:1}
.num{font-variant-numeric:tabular-nums}
.app{display:flex;height:100%;overflow:hidden}

/* Seitenleiste */
.side{width:244px;flex:none;background:var(--side);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px;font-weight:700;font-size:16px;letter-spacing:-.01em}
.logo{width:28px;height:28px;border-radius:7px;background:var(--accent);display:grid;place-items:center;flex:none}
.side-h{display:flex;align-items:center;justify-content:space-between;padding:12px 10px 4px 16px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.nav{display:flex;flex-direction:column;padding:0 8px;gap:1px}
.sp-item,.nav-item{display:flex;align-items:center;gap:10px;border:0;background:none;border-radius:6px;padding:7px 8px;text-align:left;width:100%;color:var(--text)}
.sp-item:hover,.nav-item:hover{background:var(--hover)}
.sp-item.on,.nav-item.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.sp-item.add{color:var(--muted)}
.sp-item{position:relative;cursor:pointer;user-select:none}
.sp-item.fold{color:var(--text2);font-weight:600;gap:6px}
.sp-item.fold.on-path{color:var(--text)}
.chev{width:14px;flex:none;display:inline-grid;place-items:center;color:var(--muted);transition:transform .15s;font-size:13px}
.chev.open{transform:rotate(90deg)}
.fold svg.fi{flex:none;color:var(--muted)}
.row-tools{display:none;gap:1px;margin-left:auto;flex:none}
.sp-item:hover .row-tools,.sp-item:focus-within .row-tools{display:flex}
.sp-item:hover .sp-c,.sp-item:focus-within .sp-c{display:none}
.icon-btn.xs{width:22px;height:22px;font-size:13px;border-radius:5px}
.tree-empty{font-size:12px;color:var(--muted);padding:3px 8px 5px;border-radius:6px}
.sp-item.drop-before{box-shadow:inset 0 2px 0 var(--accent)}
.sp-item.drop-after{box-shadow:inset 0 -2px 0 var(--accent)}
.sp-item.drop-into,.tree-empty.drop-into,.side-h.drop-into{background:var(--accent-soft);outline:1.5px dashed var(--accent);outline-offset:-1.5px}
.sp-item.dragsrc{opacity:.45}
#ctx{position:fixed;z-index:120;background:var(--surface);border-radius:9px;box-shadow:var(--shadow-l);padding:4px;min-width:220px;max-width:300px}
#ctx button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;padding:7px 10px;border-radius:6px;font-size:13.5px;color:var(--text)}
#ctx button:hover,#ctx button:focus-visible{background:var(--hover2);outline:none}
#ctx button.danger{color:var(--danger)}
#ctx .sep{height:1px;background:var(--border);margin:4px 2px}
#ctx .cap{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 10px 2px}
.nav-item svg{flex:none;color:var(--muted)}
.nav-item.on svg{color:var(--accent)}
.sav{width:24px;height:24px;border-radius:6px;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.sav.dashed{border:1px dashed var(--muted);color:var(--muted);font-size:14px;background:none}
.sav.lg{width:40px;height:40px;font-size:16px;border-radius:10px}
.sp-n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-c{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.badge{font-size:11px;font-weight:700;border-radius:9px;padding:0 6px;background:var(--danger);color:#fff;font-variant-numeric:tabular-nums}
.badge.soft{background:var(--hover2);color:var(--text2)}
.side-foot{margin-top:auto;padding:8px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:1px}
.nav-item.upd-go{background:var(--ok-soft);color:var(--ok);font-weight:650}
.nav-item.upd-go svg{color:var(--ok)}
.nav-item.upd-go:hover{filter:brightness(.97);background:var(--ok-soft)}
.nav-item.upd-go .badge{background:var(--ok);color:var(--surface)}
.bk-hint{font-size:12px;color:var(--warn);padding:4px 10px 6px;line-height:1.35}

/* Kopf */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 24px;background:var(--warn-soft);color:var(--warn);font-weight:550;border-bottom:1px solid var(--border)}
.head{padding:14px 24px 0}
.head-row{display:flex;align-items:center;gap:12px}
.ttl{min-width:0}
.crumb{font-size:12px;color:var(--muted)}
h1{margin:0;font-size:22px;font-weight:650;line-height:1.25;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-size:12px;color:var(--muted);white-space:nowrap}
.status.err{color:var(--danger);font-weight:600;white-space:normal}
.searchbtn{display:flex;align-items:center;gap:8px;border:1.5px solid var(--border);background:var(--surface);border-radius:6px;padding:5px 8px 5px 10px;color:var(--muted);min-width:190px}
.searchbtn:hover{border-color:var(--muted)}
.timer-pill{display:inline-flex;align-items:center;gap:8px;background:var(--ok-soft);color:var(--ok);border-radius:16px;padding:4px 6px 4px 12px;font-weight:650;font-size:13px;max-width:320px}
.timer-pill .tl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.timer-pill .tt{font-variant-numeric:tabular-nums}
.timer-pill button{border:0;background:var(--ok);color:var(--surface);width:24px;height:24px;border-radius:50%;font-size:10px;flex:none}
.tabs{display:flex;gap:2px;margin-top:12px;border-bottom:1.5px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:8px 12px;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1.5px;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab .cnt{font-weight:500;font-size:12px;margin-left:4px;color:var(--muted)}
.menu-btn{display:none}

/* Buttons */
.btn{border:0;border-radius:6px;padding:7px 13px;background:var(--hover2);font-weight:550;white-space:nowrap}
.btn:hover{filter:brightness(.95)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-h);filter:none}
.btn.danger{background:transparent;color:var(--danger)}
.btn.danger:hover{background:var(--danger-soft);filter:none}
.btn.danger-solid{background:var(--danger);color:#fff}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:var(--hover2);filter:none}
.btn.ok{background:var(--ok);color:var(--surface)}
.icon-btn{border:0;background:none;width:30px;height:30px;border-radius:6px;color:var(--muted);display:inline-grid;place-items:center;font-size:15px;line-height:1;flex:none}
.icon-btn.sm{width:26px;height:26px;font-size:14px}
.icon-btn:hover:not(:disabled){background:var(--hover2);color:var(--text)}
.icon-btn.on{color:var(--accent);background:var(--accent-soft)}
.icon-btn.del:hover{color:var(--danger)}
.link{background:none;border:0;color:var(--accent);padding:2px 4px}
.link:hover{text-decoration:underline}

/* Filter */
.fbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 24px}
.fbar:empty{display:none}
.search{position:relative}
.search input{width:220px;padding-left:30px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
select.f{border-width:1px;padding:5px 6px;max-width:170px}
select.f.act{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}

/* Inhalt */
.content{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;overflow:auto}
.board-wrap{padding:0 24px 24px}
.board{display:flex;gap:12px;align-items:flex-start;width:max-content;min-width:100%;height:100%}
.col{width:276px;flex:none;background:var(--col);border-radius:10px;display:flex;flex-direction:column;max-height:100%}
.col-h{display:flex;align-items:center;gap:8px;padding:10px 8px 6px 12px}
.col-dot{width:9px;height:9px;border-radius:50%;flex:none}
.col-n{font-weight:650;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:text}
.col-c{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.col-done{font-size:10.5px;font-weight:700;color:var(--ok);text-transform:uppercase;letter-spacing:.05em}
.col-list{display:flex;flex-direction:column;gap:8px;padding:4px 8px 6px;min-height:52px;overflow-y:auto;flex:1}
.col-empty{font-size:12px;color:var(--muted);text-align:center;padding:14px 6px;border:1.5px dashed var(--border);border-radius:8px}
.add-inline{border:0;background:none;text-align:left;padding:7px 10px;margin:0 6px 8px;border-radius:6px;color:var(--muted);font-weight:550}
.add-inline:hover{background:var(--hover2);color:var(--text)}
.inline-form{padding:0 8px 8px}
.inline-form textarea{width:100%;resize:none;border-color:var(--accent);min-height:64px}
.hint{font-size:11.5px;color:var(--muted);margin-top:4px}
.addcol{width:220px;flex:none;border:1.5px dashed var(--border);border-radius:10px;background:none;color:var(--muted);padding:14px;font-weight:600;text-align:left}
.addcol:hover{border-color:var(--accent);color:var(--accent)}

/* Notizkarte */
.card{position:relative;border-radius:8px;box-shadow:var(--shadow);padding:10px 12px;cursor:pointer;user-select:none;transition:box-shadow .12s}
.card:hover{box-shadow:var(--shadow-h)}
.card.is-done .n-title{color:var(--muted)}
.c-default{background:var(--n-default)}.c-yellow{background:var(--n-yellow)}.c-green{background:var(--n-green)}.c-blue{background:var(--n-blue)}
.c-pink{background:var(--n-pink)}.c-purple{background:var(--n-purple)}.c-orange{background:var(--n-orange)}.c-grey{background:var(--n-grey)}
.card.dragging{display:none}
.ph{border:2px dashed var(--accent);border-radius:8px;background:var(--accent-soft);flex:none}
.drag-ghost{position:fixed;z-index:80;pointer-events:none;transform:rotate(2deg);box-shadow:var(--shadow-l)!important;opacity:.95;margin:0}
.n-title{font-weight:650;font-size:14.5px;line-height:1.3;word-wrap:break-word;padding-right:20px;text-wrap:pretty}
.pin{position:absolute;top:9px;right:9px;color:var(--accent)}
.n-img{display:block;width:calc(100% + 24px);margin:-10px -12px 8px;max-height:130px;object-fit:cover;border-radius:8px 8px 0 0}
.n-body{font-size:13px;color:var(--text2);margin-top:4px;max-height:10.5em;overflow:hidden;word-wrap:break-word;-webkit-mask-image:linear-gradient(#000 75%,transparent);mask-image:linear-gradient(#000 75%,transparent)}
.n-body.short{-webkit-mask-image:none;mask-image:none}
.n-ck{margin-top:8px;display:flex;flex-direction:column;gap:3px}
.ck-row{display:flex;align-items:flex-start;gap:7px;font-size:13px;color:var(--text2);line-height:1.35;cursor:pointer}
.ck-row input{margin-top:1px}
.ck-row.done span{text-decoration:line-through;color:var(--muted)}
.ck-more{font-size:12px;color:var(--muted);padding-left:23px}
.prog{height:4px;background:var(--hover2);border-radius:2px;overflow:hidden;margin:8px 0 2px}
.prog div{height:100%;background:var(--ok);border-radius:2px}
.n-meta{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:9px;font-size:12px;color:var(--muted)}
.n-meta:empty{display:none}
.nlbl{display:inline-flex;align-items:center;font-size:11.5px;font-weight:650;padding:1px 8px;border-radius:10px;white-space:nowrap;color:#1f2430;line-height:1.5}
.nlbl.sel-off{background:transparent!important;color:var(--text2);box-shadow:inset 0 0 0 1.5px var(--border)}
.prio{display:inline-grid;place-items:center;width:18px;height:18px;flex:none}
.prio svg{display:block}
.lbl-pick{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.lbl-pick button.nlbl{border:0;cursor:pointer;padding:2px 9px}
.lbl-pick button.nlbl:hover{filter:brightness(.95)}
.lbl-pick input{flex:1;min-width:150px;padding:3px 8px;font-size:13px}
.prio-sel{display:flex;gap:4px;flex-wrap:wrap}
.prio-sel button{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--border);background:var(--surface);border-radius:6px;padding:4px 8px;font-size:12.5px;color:var(--text2)}
.prio-sel button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--text);font-weight:600}
.lb-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)}
.lb-row:last-of-type{border-bottom:0}
.lb-row input[type=text]{flex:1;min-width:120px;max-width:260px}
.tag{background:var(--hover2);color:var(--text2);font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:10px;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:10px;white-space:nowrap;font-weight:600;font-size:11.5px;background:var(--hover2);color:var(--text2);font-variant-numeric:tabular-nums}
.chip.soon{color:var(--warn);background:var(--warn-soft)}
.chip.late{color:#fff;background:var(--danger)}
.chip.run{color:var(--ok);background:var(--ok-soft)}
.colchip{font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px;color:var(--muted)}
.play{position:absolute;right:8px;bottom:8px;border:0;width:24px;height:24px;border-radius:50%;background:var(--hover2);color:var(--text2);font-size:9px;display:grid;place-items:center;opacity:0;transition:opacity .12s}
.card:hover .play,.card:focus-within .play,.play.run{opacity:1}
.play.run{background:var(--ok);color:var(--surface)}
.card.has-play .n-meta{padding-right:28px}
.card.has-play{padding-bottom:12px}

/* Markdown */
.md p{margin:0 0 .5em}.md p:last-child{margin-bottom:0}
.md ul,.md ol{margin:0 0 .5em;padding-left:1.25em}
.md li{margin:.1em 0}
.md h4{margin:.2em 0 .35em;font-size:1.02em;color:var(--text)}
.md code{font-family:var(--mono);font-size:.9em;background:var(--hover2);padding:0 4px;border-radius:3px}
.md pre{font-family:var(--mono);font-size:.88em;background:var(--hover2);padding:6px 8px;border-radius:5px;overflow-x:auto;margin:0 0 .5em;white-space:pre}
.md a{color:var(--accent);word-break:break-all}
.md a.jira{font-weight:650;text-decoration:none;background:var(--accent-soft);padding:0 4px;border-radius:3px;word-break:normal;white-space:nowrap}
.md .mdck{display:inline-block;width:12px;height:12px;border:1.5px solid var(--muted);border-radius:3px;margin-right:5px;vertical-align:-1px}
.md .mdck.on{background:var(--ok);border-color:var(--ok)}
.md blockquote{margin:0 0 .5em;padding-left:9px;border-left:3px solid var(--border);color:var(--muted)}
.md hr{border:0;border-top:1px solid var(--border);margin:.6em 0}

/* Raster-Ansichten */
.wall-wrap{padding:0 24px 32px}
.wall{columns:270px;column-gap:12px}
.wall .card{break-inside:avoid;margin-bottom:12px;display:block}
.wall .n-body{max-height:16em}
.empty-big{padding:48px 16px;text-align:center;color:var(--muted);max-width:520px;margin:0 auto}
.arch-acts{display:flex;gap:6px;margin-top:10px}
.sec-title{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 10px}
.sec-title:first-child{margin-top:6px}
.sec-title.late{color:var(--danger)}
.spchip{font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px;color:var(--muted)}
.spchip i{width:8px;height:8px;border-radius:2px;display:inline-block}

/* Seiten */
.page{max-width:900px;padding:4px 24px 48px}
.page.wide{max-width:1100px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 20px;margin-bottom:16px;min-width:0}
.panel h3{margin:0 0 10px;font-size:15px}
.panel p{margin:0 0 12px;max-width:68ch}
.panel p:last-child{margin-bottom:0}
.danger-zone{border-color:var(--danger)}
.danger-zone h3{color:var(--danger)}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.subtabs{display:flex;gap:6px;margin:4px 0 16px;flex-wrap:wrap}
.stab{border:1px solid var(--border);background:var(--surface);border-radius:16px;padding:4px 14px;font-weight:550}
.stab.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.form{max-width:540px}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.fld>label{font-size:12px;font-weight:650;color:var(--muted)}
.swatches{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sw{width:28px;height:28px;border-radius:7px;border:2px solid transparent}
.sw.on{border-color:var(--text)}
.tbl-wrap{overflow-x:auto}
.cfg{width:100%;border-collapse:collapse;margin-bottom:12px}
.cfg th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:6px;border-bottom:1px solid var(--border);white-space:nowrap}
.cfg td{padding:6px;border-bottom:1px solid var(--border);vertical-align:middle}
.cfg input[type=text]{width:100%;min-width:140px}
.cfg .ord{white-space:nowrap;width:60px}
.store-state{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;background:var(--hover);margin-bottom:12px}
.store-state b{font-weight:650}
.dotst{width:10px;height:10px;border-radius:50%;flex:none;background:var(--muted)}
.dotst.ok{background:var(--ok)}.dotst.warn{background:var(--warn)}
.tpl-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.tpl-row:last-of-type{border-bottom:0}
.tpl-sw{width:14px;height:14px;border-radius:4px;flex:none;border:1px solid var(--border)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;align-items:center}

/* Zeiterfassung */
.tsum{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.tsum .kpi{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 16px;min-width:150px}
.kpi-n{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi-l{font-size:12px;color:var(--muted)}
.ttable{width:100%;border-collapse:collapse;font-size:13px}
.ttable th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:7px 8px;border-bottom:1.5px solid var(--border);white-space:nowrap}
.ttable td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:top}
.ttable .day td{background:var(--hover);font-weight:650;border-bottom:1px solid var(--border)}
.ttable .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ttable tr.clk{cursor:pointer}
.ttable tr.clk:hover td{background:var(--hover)}

/* Dialoge */
dialog{border:0;border-radius:12px;padding:0;background:var(--surface);color:var(--text);box-shadow:var(--shadow-l);width:min(800px,calc(100vw - 24px));max-height:calc(100vh - 32px)}
dialog.small{width:min(460px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(20,24,32,.5)}
.ed{display:flex;flex-direction:column;max-height:calc(100vh - 32px)}
.ed-top{display:flex;align-items:center;gap:6px;padding:10px 12px 6px 16px;flex-wrap:wrap;flex:none}
.dots{display:flex;gap:5px;align-items:center}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);padding:0}
.dot.on{border-color:var(--text);box-shadow:0 0 0 2px var(--surface) inset}
.ed-loc{font-size:12px;color:var(--muted);margin-left:8px}
.ed-body{padding:4px 20px 16px;overflow-y:auto;flex:1}
.tplbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:2px 0 10px;font-size:12.5px;color:var(--muted)}
.tplbar button{border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:2px 10px;font-size:12.5px}
.tplbar button:hover{border-color:var(--accent);color:var(--accent)}
.ed-title{width:100%;font-size:21px;font-weight:650;border-color:transparent;padding:4px 6px;margin:0 0 6px -7px;width:calc(100% + 7px);background:transparent}
.ed-title:hover{background:var(--hover)}
.ed-title:focus{border-color:var(--accent);background:var(--surface)}
.seg{display:flex;gap:4px;margin:2px 0 6px;align-items:center}
.seg button{border:0;background:none;padding:3px 10px;border-radius:5px;font-weight:600;color:var(--muted);font-size:13px}
.seg button.on{background:var(--hover2);color:var(--text)}
.ed-text{width:100%;min-height:150px;resize:vertical;line-height:1.5}
.ed-prev{min-height:120px;border:1.5px solid var(--border);border-radius:6px;padding:8px 10px;font-size:14px;cursor:text}
.ed-sec{margin-top:18px}
.ed-sec-h{font-weight:650;font-size:13px;margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ck-edit{display:flex;align-items:center;gap:8px;padding:2px 0}
.ck-edit input[type=text]{flex:1;border-color:transparent;padding:4px 6px;background:transparent}
.ck-edit input[type=text]:hover{background:var(--hover)}
.ck-edit input[type=text]:focus{border-color:var(--accent);background:var(--surface)}
.ck-edit.done input[type=text]{text-decoration:line-through;color:var(--muted)}
.ck-add{width:100%;border-style:dashed;margin-top:4px}
.ed-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:18px}
.ed-grid .fld{margin:0}
.ed-grid .full{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.chips button{border:1px dashed var(--border);background:none;border-radius:10px;font-size:11.5px;padding:0 7px;color:var(--muted)}
.chips button:hover{border-color:var(--accent);color:var(--accent)}
.tm-row{display:flex;align-items:center;gap:10px;padding:4px 0;font-size:13px;border-bottom:1px solid var(--border)}
.tm-row .d{width:86px;color:var(--muted);font-variant-numeric:tabular-nums}
.tm-row .m{width:52px;text-align:right;font-weight:650;font-variant-numeric:tabular-nums}
.tm-row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text2)}
.tm-add{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tm-add input{padding:4px 8px;font-size:13px}
.tm-add .min{width:110px}.tm-add .txt{flex:1;min-width:140px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumb{position:relative;width:96px;height:72px;border-radius:6px;overflow:hidden;border:1px solid var(--border);background:var(--hover)}
.thumb img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;display:block}
.thumb button{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:11px;display:grid;place-items:center}
.dropzone{border:1.5px dashed var(--border);border-radius:6px;padding:10px;color:var(--muted);font-size:12.5px;text-align:center}
.ed.dragover .dropzone{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.ed-info{font-size:12px;color:var(--muted);margin-top:16px}
.ed-foot{display:flex;align-items:center;gap:4px;padding:10px 14px 14px;border-top:1px solid var(--border);flex-wrap:wrap;flex:none}
.df{display:flex;align-items:center;gap:8px;padding:12px 20px 16px;border-top:1px solid var(--border)}
.dh{padding:16px 20px 8px;font-size:17px;font-weight:650}
.ab{padding:4px 20px 8px;max-height:65vh;overflow-y:auto}
.atext{margin:0 0 14px}
.ab .fld input,.ab .fld select,.ab .fld textarea{width:100%}
#lightbox{width:auto;max-width:calc(100vw - 32px);background:transparent;box-shadow:none}
#lightbox img{max-width:calc(100vw - 48px);max-height:calc(100vh - 48px);display:block;border-radius:8px;cursor:zoom-out}

/* Suche / Befehle */
#pal{width:min(620px,calc(100vw - 24px));margin-top:12vh}
.pal-in{width:100%;border:0;border-bottom:1px solid var(--border);border-radius:12px 12px 0 0;padding:14px 18px;font-size:16px;background:transparent}
.pal-in:focus{border-color:var(--border)}
.pal-list{max-height:52vh;overflow-y:auto;padding:6px}
.pal-it{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;cursor:pointer;min-width:0}
.pal-it.on{background:var(--accent-soft)}
.pal-it .pi{width:20px;text-align:center;color:var(--muted);flex:none}
.pal-it .pt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal-it .ps{font-size:12px;color:var(--muted);white-space:nowrap}
.pal-sec{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 10px 4px}
.pal-foot{padding:8px 14px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}

#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--toast-bg);color:var(--toast-fg);border-radius:8px;padding:10px 14px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow-l);opacity:0;pointer-events:none;transition:.2s;z-index:100;max-width:calc(100vw - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:none;border:0;color:var(--toast-link);font-weight:650;padding:0}
#printArea{display:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

@media(max-width:860px){
  .side{position:fixed;left:0;top:0;bottom:0;z-index:60;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow-l)}
  .app.menu-open .side{transform:none}
  .app.menu-open .scrim{display:block;position:fixed;inset:0;background:rgba(20,24,32,.4);z-index:55}
  .menu-btn{display:inline-grid}
  .head,.fbar,.board-wrap,.wall-wrap,.page,.banner{padding-left:16px;padding-right:16px}
  .search input{width:160px}
  .status,.searchbtn .lbl{display:none}
  .searchbtn{min-width:0}
  .col{width:min(84vw,320px)}
}
.scrim{display:none}

/* Druck */
@media print{
  @page{margin:16mm}
  body{background:#fff;color:#000;height:auto}
  .app,dialog,#toast{display:none!important}
  #printArea{display:block;font:11pt/1.45 var(--font);color:#000}
  #printArea h1{font-size:20pt;margin:0 0 2pt;white-space:normal}
  #printArea .pmeta{color:#555;font-size:9.5pt;margin-bottom:14pt}
  #printArea h2{font-size:13pt;margin:16pt 0 6pt;padding-bottom:3pt;border-bottom:1.5pt solid #000;break-after:avoid}
  #printArea .pn{border:1pt solid #bbb;border-radius:4pt;padding:7pt 9pt;margin:0 0 8pt;break-inside:avoid}
  #printArea .pn h3{font-size:11.5pt;margin:0 0 3pt}
  #printArea .pn .pm{font-size:9pt;color:#555;margin-bottom:4pt}
  #printArea .md a{color:#000;text-decoration:underline}
  #printArea .md code,#printArea .md pre{background:#f1f1f1}
  #printArea ul.pck{list-style:none;padding-left:0;margin:4pt 0 0}
  #printArea ul.pck li::before{content:"☐ "}
  #printArea ul.pck li.done::before{content:"☑ "}
  #printArea img{max-width:100%;max-height:90mm;margin-top:5pt;border:1pt solid #ddd}
  #printArea table{width:100%;border-collapse:collapse;font-size:10pt}
  #printArea th,#printArea td{border-bottom:.5pt solid #999;padding:3pt 4pt;text-align:left;vertical-align:top}
  #printArea .r{text-align:right}
  #printArea tr.day td{font-weight:700;background:#eee}
}
</style>

<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <div class="scrim" data-act="menu"></div>
  <div class="main">
    <div class="banner" id="banner" hidden></div>
    <header class="head" id="head"></header>
    <div class="fbar" id="fbar"></div>
    <div class="content" id="content"></div>
  </div>
</div>
<dialog id="dlg"></dialog>
<dialog id="dlg2" class="small"></dialog>
<dialog id="pal"></dialog>
<dialog id="lightbox"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<div id="printArea"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<input type="file" id="imgIn" accept="image/*" multiple hidden>

<script>
'use strict';
/* ============ Grundlagen ============ */
const LS='kanban-notizen-office-v1',LSMETA='kanban-notizen-office-file',IDB='kanban-notizen-office';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const now=()=>new Date().toISOString();
const isoDay=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>isoDay(new Date());
const addDays=(ds,n)=>{const d=new Date(ds+'T12:00:00');d.setDate(d.getDate()+n);return isoDay(d)};
const dow=ds=>new Date(ds+'T12:00:00').getDay();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr=x=>Array.isArray(x)?x:[];
const isDate=d=>/^\d{4}-\d{2}-\d{2}$/.test(d||'');
const isTime=t=>/^([01]\d|2[0-3]):[0-5]\d$/.test(t||'');
const okId=x=>/^[A-Za-z0-9_~:@+-]{1,100}$/.test(String(x||''));
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
const fmtDate=d=>{if(!d)return'';const[y,m,t]=d.split('-');return`${t}.${m}.${y}`};
const fmtShort=d=>{if(!d)return'';const t=today();if(d===t)return'Heute';if(d===addDays(t,1))return'Morgen';if(d===addDays(t,-1))return'Gestern';const[y,m,dd]=d.split('-');return`${WD[dow(d)]} ${dd}.${m}.`+(y!==t.slice(0,4)?y.slice(2):'')};
const fmtTime=iso=>iso?new Date(iso).toLocaleString('de-CH',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'';

const rel=iso=>{const s=(Date.now()-Date.parse(iso))/1e3;if(s<60)return'gerade eben';if(s<3600)return`vor ${Math.floor(s/60)} Min.`;if(s<86400)return`vor ${Math.floor(s/3600)} Std.`;const d=Math.floor(s/86400);if(d===1)return'gestern';if(d<30)return`vor ${d} Tagen`;return fmtDate(iso.slice(0,10))};

function parseMin(v){v=String(v||'').trim().toLowerCase().replace(',','.');if(!v)return 0;let m;
  if((m=v.match(/^(\d+):(\d{1,2})$/)))return +m[1]*60+ +m[2];

  if((m=v.match(/^(\d+)\s*(?:m|min)?$/)))return +m[1];return 0}

const NCOL=[{id:'default',n:'Weiss',d:'#ffffff'},{id:'yellow',n:'Gelb',d:'#f5cd47'},{id:'green',n:'Grün',d:'#4bce97'},{id:'blue',n:'Blau',d:'#6f9cff'},{id:'pink',n:'Rosa',d:'#ef7fbd'},{id:'purple',n:'Lila',d:'#a48ef5'},{id:'orange',n:'Orange',d:'#fa9d5a'},{id:'grey',n:'Grau',d:'#a0a3ab'}];

const SPCOL=['#2f5bd3','#1f8fbf','#1f9d6b','#6aa84f','#d4a015','#e0742c','#d24b3e','#c8508f','#7a55d6','#5a6275'];

const PRIO=Object.fromEntries(PRIOS.map(p=>[p.id,p]));const PRANK=id=>id?PRIOS.findIndex(p=>p.id===id):9;

  if(id==='medium')return`<span class="prio" title="Priorität: ${p.n}"><svg width="${sz}" height="${sz}" viewBox="0 0 16 16"><path d="M3 6h10M3 10h10" stroke="${p.c}" stroke-width="2.2" stroke-linecap="round"/></svg></span>`;

const LCOL=[{id:'red',n:'Rot',c:'#f8857a'},{id:'orange',n:'Orange',c:'#fbac6e'},{id:'yellow',n:'Gelb',c:'#f5cd47'},{id:'green',n:'Grün',c:'#6fd3a0'},{id:'teal',n:'Türkis',c:'#6cc9d6'},{id:'blue',n:'Blau',c:'#8fb2ff'},{id:'purple',n:'Lila',c:'#b9a5f7'},{id:'pink',n:'Rosa',c:'#f49ccb'},{id:'grey',n:'Grau',c:'#c2c5cc'}];

function labelColorId(name){const c=DB&&DB.settings.labels[name];if(LC[c])return c;let h=0;for(const ch of name)h=(h*31+ch.charCodeAt(0))>>>0;return LCOL[h%LCOL.length].id}

const REPEAT={'':'Nie',daily:'Täglich',weekdays:'Werktags (Mo–Fr)',weekly:'Wöchentlich',biweekly:'Alle 2 Wochen',monthly:'Monatlich',yearly:'Jährlich'};

    timerStart:n.timerStart&&!isNaN(Date.parse(n.timerStart))?n.timerStart:'',
    images:arr(n.images).filter(i=>i&&/^data:image\//.test(i.data||'')).map(i=>({id:okId(i.id)?String(i.id):uid(),data:i.data,name:String(i.name||'Bild')})),
    prio:PRIO[n.prio]?n.prio:'',archived:!!n.archived,order:isFinite(+n.order)?+n.order:k,created:n.created||now(),updated:n.updated||n.created||now()}}
function normSpace(s){
  const cols=arr(s.columns).filter(Boolean),hasFlag=cols.some(c=>'done' in c);
  const o={sort:SORTS[s.sort]?s.sort:'manual',id:okId(s.id)?String(s.id):uid(),folder:okId(s.folder)?String(s.folder):'',name:String(s.name||'Space'),color:/^#[0-9a-f]{6}$/i.test(s.color)?s.color:SPCOL[0],desc:String(s.desc||''),created:s.created||now(),
    columns:cols.map(c=>({id:okId(c.id)?String(c.id):uid(),name:String(c.name||'Spalte'),color:NC[c.color]?c.color:'grey',done:hasFlag?!!c.done:/erledigt|fertig|done|kann ich|abgeschlossen|gelöst/i.test(c.name||'')}))};
  if(!o.columns.length)o.columns=[{id:uid(),name:'Notizen',color:'yellow',done:false}];
  o.notes=arr(s.notes).filter(n=>n&&typeof n==='object').map((n,k)=>normNote(n,o,k));
  const seen=new Set();o.notes=o.notes.filter(n=>!seen.has(n.id)&&seen.add(n.id));

function fromV2(s){
  const iss=arr(s.issues);
  if(/^Beispiel-Space/.test(s.desc||'')&&iss.every(i=>arr(i.history).length<=1&&!arr(i.comments).length))return null;
  const o={id:s.id,name:s.name,color:s.color,desc:s.desc,created:s.created,columns:arr(s.statuses).map(x=>({id:x.id,name:x.name,color:{todo:'grey',progress:'blue',done:'green'}[x.cat]||'grey',done:x.cat==='done'}))};
  o.notes=iss.map(i=>{let body=String(i.desc||'');const cm=arr(i.comments);
    if(cm.length)body+=(body?'\n\n':'')+'## Kommentare\n'+cm.map(c=>'- '+String(c.text).replace(/\n/g,' ')).join('\n');
    return{id:i.id,title:i.title,body,tags:i.labels,colId:i.statusId,due:i.due,order:i.order,created:i.created,updated:i.updated,prio:PRIO[i.prio]&&i.prio!=='medium'?i.prio:'',color:'default'}});
  return normSpace(o)}

  issues:arr(d.issues).map(i=>({id:i.id,title:i.title,desc:i.desc,labels:i.labels,statusId:i.col,due:i.due,order:i.order,created:i.created,updated:i.updated,history:[1,2],comments:i.comments,prio:i.prio}))})}

  templates:Array.isArray(x.templates)?x.templates.filter(t=>t&&t.name).map(t=>({id:okId(t.id)?t.id:uid(),name:String(t.name),color:NC[t.color]?t.color:'default',title:String(t.title||''),body:String(t.body||''),tags:arr(t.tags).map(String),checklist:arr(t.checklist).map(String).filter(Boolean)})):DEFAULT_TPL(),
  labels:(()=>{const o={};if(x.labels&&typeof x.labels==='object')for(const[k,v]of Object.entries(x.labels))if(LC[v]&&k.trim())o[k]=v;return o})(),notify:!!x.notify,lastBackup:x.lastBackup||'',round:[0,5,6,10,15,30].includes(+x.round)?+x.round:0}}
function normDB(d){
  d=d||{};
  let spaces=arr(d.spaces).filter(Boolean).map(s=>arr(s.columns).length||!arr(s.statuses).length?normSpace(s):fromV2(s)).filter(Boolean);
  if(!spaces.length)spaces=seedSpaces();
  const ui0=Object.assign({view:'board'},d.ui||{});if(![...SPACE_VIEWS,...GLOBAL_VIEWS].includes(ui0.view))ui0.view='board';
  const fl=arr(d.folders).filter(f=>f&&f.name).map(f=>({id:okId(f.id)?String(f.id):uid(),name:String(f.name).slice(0,60),parent:okId(f.parent)?String(f.parent):'',collapsed:!!f.collapsed}));
  const fids=new Set(fl.map(f=>f.id));fl.forEach(f=>{if(!fids.has(f.parent)||f.parent===f.id)f.parent=''});
  fl.forEach(f=>{let p=f.parent;const seen=new Set([f.id]);let g=0;while(p&&g++<100){if(seen.has(p)){f.parent='';break}seen.add(p);p=(fl.find(x=>x.id===p)||{}).parent}});
  spaces.forEach(s=>{if(!fids.has(s.folder))s.folder=''});
  const out={v:4,folders:fl,spaces,settings:normSettings(d.settings),active:d.active,ui:ui0};
  if(!spaces.some(s=>s.id===out.active))out.active=spaces[0].id;
  return out}

async function tauriInfo(){const i=await tInvoke('data_info');tv.path=i.path;tv.isDefault=i.is_default;return i}

  if(txt&&txt.trim()){const d=JSON.parse(txt);if(!Array.isArray(d.spaces))throw new Error('Die Datei enthält keine Kanban-Notizen');applyFileData(d);tv.mtime=i.mtime;return true}return false}

  try{upd.current=await TAURI.app.getVersion()}catch(e){}

  try{if(await tauriLoad())setStatus('Geladen · '+hhmm());else{await tauriWrite();toast('Deine Notizen werden hier gespeichert: '+tv.path)}}
  catch(e){console.warn(e);setStatus('Datei konnte nicht gelesen werden: '+e,true)}}
function tauriSchedule(){tv.dirty=true;clearTimeout(tv.timer);tv.timer=setTimeout(tauriWrite,400)}
async function tauriWrite(){if(tv.writing){tauriSchedule();return}tv.writing=true;
  try{tv.mtime=await tInvoke('save_data',{json:JSON.stringify(payload()),day:today()});tv.dirty=false;setStatus('Gespeichert · '+hhmm())}
  catch(e){setStatus('Speichern fehlgeschlagen: '+e,true)}finally{tv.writing=false}}

  try{const i=await tInvoke('data_info');if(i.mtime&&i.mtime>tv.mtime+1){if(busy()){pendingExternal='tauri';return}await tauriLoad();toast('Neuere Version aus der Datei geladen')}}catch(e){}}

async function tauriOpenFile(){const p=await TAURI.dialog.open({multiple:false,directory:false,filters:jsonFilter});if(!p)return;

function md(src){const out=[];let list=null,para=[],code=null;

function advance(d,r){

  return d}

  $$('button',m).forEach(b=>b.onclick=e=>{e.stopPropagation();const it=items[+b.dataset.k];closeMenu();it.run()});
  const f=$('button',m);if(f)f.focus();

  const r=await ask({title:`Kategorie „${f.name}“ auflösen?`,text:`Es wird nichts gelöscht: ${sps||subs?`${sps} Space${sps===1?'':'s'}${subs?` und ${subs} Unterkategorie${subs===1?'':'n'}`:''} wandern nach <b>${par?esc(par.name):'oberste Ebene'}</b>.`:'Die Kategorie ist leer.'}`,ok:'Auflösen',danger:true});if(!r)return;
  const snap=JSON.stringify(DB);DB.folders.forEach(x=>{if(x.parent===f.id)x.parent=f.parent});DB.spaces.forEach(x=>{if(x.folder===f.id)x.folder=f.parent});DB.folders=DB.folders.filter(x=>x!==f);save();render();toast(`Kategorie „${f.name}“ aufgelöst`,{undo:snap})}
let treeDrag=null;
function clearDrop(){$$('#side .drop-before,#side .drop-after,#side .drop-into').forEach(x=>x.classList.remove('drop-before','drop-after','drop-into'))}
function dropPos(el,e){const[kind,id]=(el.dataset.dnd||'').split(':'),[sk,sid]=treeDrag.split(':');
  if(el.hasAttribute('data-dnd-root'))return'root';
  if(el.dataset.dndInto){if(sk==='folder'&&(sid===el.dataset.dndInto||isFolderInside(el.dataset.dndInto,sid)))return null;return'into'}
  if(treeDrag===el.dataset.dnd)return null;
  const r=el.getBoundingClientRect(),y=(e.clientY-r.top)/r.height;
  if(kind==='folder'){if(sk==='folder'&&isFolderInside(id,sid))return null;return y<.28?'before':y>.72?'after':'into'}
  return y<.5?'before':'after'}
function treeMove(src,tgtEl,pos){const[sk,sid]=src.split(':');let tk='',tid='';
  if(pos==='root'){}else if(tgtEl.dataset.dndInto){tk='folder';tid=tgtEl.dataset.dndInto}else[tk,tid]=tgtEl.dataset.dnd.split(':');
  if(sk==='space'){const s=spaceById(sid);if(!s)return;let parent='';
    if(pos==='root')parent='';else if(tk==='folder'){const f=folderById(tid);parent=pos==='into'?f.id:f.parent}else parent=spaceById(tid).folder;
    s.folder=parent;DB.spaces.splice(DB.spaces.indexOf(s),1);
    if(tk==='space'){let i=DB.spaces.indexOf(spaceById(tid));if(pos==='after')i++;DB.spaces.splice(i,0,s)}
    else if(tk==='folder'&&pos==='before'){const i=DB.spaces.findIndex(x=>x.folder===parent);DB.spaces.splice(i<0?DB.spaces.length:i,0,s)}
    else DB.spaces.push(s);
    expandTo(parent)}
  else{const f=folderById(sid);if(!f)return;
    if(pos==='root'){f.parent=''}
    else if(tk==='folder'){const t=folderById(tid);if(pos==='into'){f.parent=t.id;t.collapsed=false;DB.folders.splice(DB.folders.indexOf(f),1);DB.folders.push(f)}
      else{f.parent=t.parent;DB.folders.splice(DB.folders.indexOf(f),1);let i=DB.folders.indexOf(t);if(pos==='after')i++;DB.folders.splice(i,0,f)}}
    else f.parent=spaceById(tid).folder;
    expandTo(f.parent)}
  save(true);render()}
function bindTree(){const side=$('#side');
  $$('[data-dnd],[data-dnd-into],[data-dnd-root]',side).forEach(el=>{
    if(el.dataset.dnd){el.addEventListener('dragstart',e=>{treeDrag=el.dataset.dnd;e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',el.textContent.trim())}catch(_){}setTimeout(()=>el.classList.add('dragsrc'),0)});
      el.addEventListener('dragend',()=>{treeDrag=null;clearDrop();el.classList.remove('dragsrc')})}
    el.addEventListener('dragover',e=>{if(!treeDrag)return;const pos=dropPos(el,e);if(!pos)return;e.preventDefault();e.dataTransfer.dropEffect='move';
      if(el.dataset.pos!==pos||!el.classList.contains('drop-'+(pos==='root'?'into':pos))){clearDrop();el.classList.add('drop-'+(pos==='root'?'into':pos))}el.dataset.pos=pos;
      if(el.dataset.folder){clearTimeout(el._open);const f=folderById(el.dataset.folder);if(f&&f.collapsed&&pos==='into')el._open=setTimeout(()=>{if(treeDrag){f.collapsed=false;renderSide()}},700)}});
    el.addEventListener('dragleave',e=>{if(!el.contains(e.relatedTarget)){el.classList.remove('drop-before','drop-after','drop-into');clearTimeout(el._open)}});
    el.addEventListener('drop',e=>{e.preventDefault();const pos=el.dataset.pos;clearDrop();const src=treeDrag;treeDrag=null;if(src&&pos)treeMove(src,el,pos)})});
  $$('.sp-item[role=button]',side).forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){if(e.target!==el)return;e.preventDefault();el.click()}
    else if(e.key==='ContextMenu'||(e.shiftKey&&e.key==='F10')){e.preventDefault();const[x,y]=menuAt(el);el.dataset.folder?folderMenu(folderById(el.dataset.folder),x,y):el.dataset.space&&spaceMenu(spaceById(el.dataset.space),x,y)}
    else if(el.dataset.folder&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){const f=folderById(el.dataset.folder);if((e.key==='ArrowRight')===!!f.collapsed){e.preventDefault();toggleFolder(f.id);$(`[data-folder="${f.id}"]`)?.focus()}}}));
  side.oncontextmenu=e=>{const fo=e.target.closest('[data-folder]'),spc=e.target.closest('[data-space]');if(fo){e.preventDefault();folderMenu(folderById(fo.dataset.folder),e.clientX,e.clientY)}else if(spc){e.preventDefault();spaceMenu(spaceById(spc.dataset.space),e.clientX,e.clientY)}}}

  const so=$('#fSort');if(so)so.onchange=e=>{s.sort=e.target.value;save(true);renderContent()}}
function renderContent(){const c=$('#content'),old=$('#bw'),v=DB.ui.view,key=v+(v==='spacecfg'?ui.stab:'')+(v==='settings'?ui.gtab:'')+(SPACE_VIEWS.includes(v)?DB.active:'');
  const sc=old&&old.dataset.k===key?{l:old.scrollLeft,t:old.scrollTop,cols:$$('.col-list',old).map(x=>x.scrollTop)}:null;
  ({board:renderBoard,wall:renderWall,archive:renderArchive,spacecfg:renderSpaceCfg,today:renderToday,time:renderTime,settings:renderSettings}[v]||renderBoard)(c);
  const nw=$('#bw');if(nw){nw.dataset.k=key;if(sc){nw.scrollLeft=sc.l;nw.scrollTop=sc.t;$$('.col-list',nw).forEach((x,k)=>{if(sc.cols[k])x.scrollTop=sc.cols[k]})}}}
function matches(s,n){const f=ui.filters;
  if(f.q){const q=f.q.trim().toLowerCase();if(q&&![n.title,n.body,n.tags.join(' '),n.checklist.map(c=>c.text).join(' ')].join('\n').toLowerCase().includes(q))return false}
  if(f.tag&&!n.tags.includes(f.tag))return false;
  if(f.color&&n.color!==f.color)return false;
  if(f.prio&&(f.prio==='none'?!!n.prio:n.prio!==f.prio))return false;
  if(f.pinned&&!n.pinned)return false;
  if(f.due){const t=today();
    if(f.due==='late'&&dueState(s,n)!=='late')return false;
    if(f.due==='today'&&n.due!==t)return false;
    if(f.due==='week'&&!(n.due&&n.due>=t&&n.due<=addDays(t,7)))return false;
    if(f.due==='any'&&!n.due)return false;
    if(f.due==='none'&&n.due)return false}
  return true}

/* ============ Karten ============ */
function cardHTML(s,n,opt={}){
  const st=dueState(s,n),done=isDone(s,n);
  const dn=n.checklist.filter(c=>c.done).length,tot=n.checklist.length,show=n.checklist.slice(0,opt.wall?8:5);
  const short=n.body.split('\n').length<=6&&n.body.length<280;
  const col=opt.showCol?colOf(s,n):null,tt=timeTotal(n),run=!!n.timerStart;
  return`<div class="card c-${n.color}${done?' is-done':''}${opt.ro?'':' has-play'}" data-id="${n.id}" data-sid="${s.id}" tabindex="0" role="button" aria-label="${esc(noteLabel(n))}">
  ${n.images.length?`<img class="n-img" src="${n.images[0].data}" alt="">`:''}
  ${n.pinned?`<span class="pin" title="Angeheftet">${SVG.pin}</span>`:''}
  ${n.title.trim()?`<div class="n-title">${esc(n.title)}</div>`:''}
  ${n.body.trim()?`<div class="n-body md${short?' short':''}"${n.title.trim()?'':' style="margin-top:0"'}>${md(n.body)}</div>`:''}
  ${!n.title.trim()&&!n.body.trim()&&!tot&&!n.images.length?'<div class="n-title muted">Leere Notiz</div>':''}
  ${tot?`<div class="prog" title="${dn} von ${tot} erledigt"><div style="width:${dn/tot*100}%"></div></div><div class="n-ck">${show.map(c=>`<label class="ck-row${c.done?' done':''}"><input type="checkbox" data-ck="${n.id}:${c.id}"${c.done?' checked':''}${opt.ro?' disabled':''}><span>${esc(c.text)}</span></label>`).join('')}${tot>show.length?`<div class="ck-more">+ ${tot-show.length} weitere</div>`:''}</div>`:''}
  <div class="n-meta">${n.prio?prioIcon(n.prio):''}${opt.showSpace?`<span class="spchip"><i style="background:${esc(s.color)}"></i>${esc(s.name)}</span>`:''}${col?`<span class="colchip"><span class="col-dot" style="background:${NC[col.color].d}"></span>${esc(col.name)}</span>`:''}${n.due?`<span class="chip ${st}" title="Termin ${fmtDate(n.due)}${n.dueTime?' '+n.dueTime:''}">${SVG.cal}${fmtShort(n.due)}${n.dueTime?' '+n.dueTime:''}</span>`:''}${n.repeat?`<span class="chip" title="Wiederholt sich: ${REPEAT[n.repeat]}">${SVG.rep}</span>`:''}${run?`<span class="chip run">${SVG.clock}<span data-runclock="${n.id}">${clock(Date.now()-Date.parse(n.timerStart)).replace(/^00:/,'')}</span></span>`:tt?`<span class="chip" title="Erfasste Zeit">${SVG.clock}${hm(tt)}</span>`:''}${n.images.length>1?`<span class="chip">${SVG.img}${n.images.length}</span>`:''}${n.tags.map(lblHTML).join('')}</div>
  ${opt.ro?'':`<button class="play${run?' run':''}" data-play="${n.id}" title="${run?'Zeit stoppen':'Zeit starten'}" aria-label="${run?'Zeit stoppen':'Zeit starten'}">${run?'■':'▶'}</button>`}
  ${opt.archive?`<div class="arch-acts"><button class="btn sm" data-restore="${n.id}">Wiederherstellen</button><button class="btn sm danger" data-purge="${n.id}">Löschen</button></div>`:''}
  </div>`}
function bindCards(el,opt={}){
  $$('.card',el).forEach(c=>{const s=spaceById(c.dataset.sid);
    c.addEventListener('click',e=>{if(suppressClick||e.target.closest('input,button,a,label'))return;openNote(s.id,c.dataset.id)});
    c.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target===c)openNote(s.id,c.dataset.id)});
    if(opt.drag)bindDrag(c)});
  $$('[data-ck]',el).forEach(b=>b.addEventListener('change',()=>{const s=spaceById(b.closest('.card').dataset.sid);const[nid,cid]=b.dataset.ck.split(':');const n=byId(s,nid);const it=n&&n.checklist.find(x=>x.id===cid);if(!it)return;it.done=b.checked;n.updated=now();save();setTimeout(renderContent,120)}));
  $$('[data-play]',el).forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const s=spaceById(b.closest('.card').dataset.sid);const n=byId(s,b.dataset.play);if(n)toggleTimer(s,n)}))}

/* ============ Board ============ */
function renderBoard(el){
  const s=sp(),notes=live(s).filter(n=>matches(s,n));
  el.innerHTML=`<div class="scroll board-wrap" id="bw"><div class="board">${s.columns.map(c=>{const cn=notes.filter(n=>n.colId===c.id).sort(colSort(s)),all=live(s).filter(n=>n.colId===c.id).length;

    <div class="col-list" data-col="${c.id}">${cn.map(n=>cardHTML(s,n)).join('')||`<div class="col-empty">${all?'Keine Treffer':'Noch keine Notizen'}</div>`}</div>
    <button class="add-inline" data-inline="${c.id}">+ Schnelle Notiz</button></section>`}).join('')}
    <button class="addcol" data-act="addCol">+ Spalte hinzufügen</button></div></div>`;
  bindCards(el,{drag:true});
  $$('[data-addto]',el).forEach(b=>b.onclick=()=>createNote(s.id,b.dataset.addto));
  $$('[data-inline]',el).forEach(b=>b.onclick=()=>inlineAdd(b));
  $$('[data-ren]',el).forEach(x=>x.ondblclick=()=>renameCol(s,s.columns.find(c=>c.id===x.dataset.ren)))}
function inlineAdd(btn){const s=sp(),colId=btn.dataset.inline,w=document.createElement('div');w.className='inline-form';
  w.innerHTML='<textarea rows="3" placeholder="Notiz schreiben … (erste Zeile = Titel)" aria-label="Schnelle Notiz"></textarea><div class="hint"><kbd>Enter</kbd> speichern · <kbd>Shift</kbd>+<kbd>Enter</kbd> neue Zeile · <kbd>Esc</kbd> abbrechen</div>';
  btn.replaceWith(w);const ta=$('textarea',w);ta.focus();w.closest('.col').querySelector('.col-list').scrollTop=1e6;
  ta.onkeydown=e=>{if(e.key==='Escape'){e.preventDefault();e.stopPropagation();renderContent();applyExternal()}else if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();const t=ta.value.trim();if(!t)return;
    const[first,...rest]=t.split('\n');newNote(s,{colId,title:first.trim(),body:rest.join('\n').trim()});save();renderContent();renderSide();
    const nb=$(`[data-inline="${colId}"]`);if(nb)inlineAdd(nb)}};
  w.addEventListener('focusout',()=>setTimeout(()=>{if(w.isConnected&&!w.contains(document.activeElement)&&!ta.value.trim()){renderContent();applyExternal()}},200))}
function moveNote(s,id,colId,beforeId){
  const n=byId(s,id);if(!n)return;const wasDone=isDone(s,n);
  const list=live(s).filter(x=>x.colId===colId&&x.id!==id).sort(dispSort);
  let k=beforeId?list.findIndex(x=>x.id===beforeId):-1;if(k<0)k=list.length;list.splice(k,0,n);
  if(n.colId!==colId){n.colId=colId;n.updated=now()}
  list.forEach((x,i)=>x.order=i);afterDone(s,n,wasDone);save();render()}

/* Ziehen mit Maus und Touch */
let drag=null,suppressClick=false;
function bindDrag(card){
  card.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button!==0||e.target.closest('input,button,a,label'))return;preDrag(card,e.clientX,e.clientY,false)});
  card.addEventListener('touchstart',e=>{if(e.touches.length!==1||e.target.closest('input,button,a,label'))return;const t=e.touches[0];preDrag(card,t.clientX,t.clientY,true)},{passive:true})}
function preDrag(card,x,y,touch){drag={id:card.dataset.id,sid:card.dataset.sid,card,sx:x,sy:y,x,y,started:false,touch};
  if(touch)drag.timer=setTimeout(()=>{if(drag&&!drag.started)startDrag()},300)}
function startDrag(){const d=drag,r=d.card.getBoundingClientRect();d.started=true;
  d.ox=d.sx-r.left;d.oy=d.sy-r.top;d.ghost=d.card.cloneNode(true);d.ghost.classList.add('drag-ghost');d.ghost.style.width=r.width+'px';d.ghost.style.left=r.left+'px';d.ghost.style.top=r.top+'px';
  document.body.appendChild(d.ghost);d.ph=document.createElement('div');d.ph.className='ph';d.ph.style.height=r.height+'px';d.card.before(d.ph);d.card.classList.add('dragging');
  document.body.classList.add('is-dragging');d.tick=setInterval(dragTick,30);placeDrag()}
function placeDrag(){const d=drag;d.ghost.style.left=(d.x-d.ox)+'px';d.ghost.style.top=(d.y-d.oy)+'px';
  const el=document.elementFromPoint(d.x,d.y);let list=el&&el.closest('.col-list');
  if(!list){let col=el&&el.closest('.col');
    if(!col){let best=null,bd=1e9;$$('.col').forEach(c=>{const r=c.getBoundingClientRect();if(r.right<0||r.left>innerWidth)return;const dd=d.x<r.left?r.left-d.x:d.x>r.right?d.x-r.right:0;if(dd<bd){bd=dd;best=c}});col=best}
    if(col)list=$('.col-list',col)}
  if(!list)return;const em=$('.col-empty',list);if(em)em.remove();
  const after=$$('.card:not(.dragging)',list).find(c=>{const r=c.getBoundingClientRect();return d.y<r.top+r.height/2});
  if(after){if(d.ph.nextElementSibling!==after)list.insertBefore(d.ph,after)}else if(list.lastElementChild!==d.ph)list.appendChild(d.ph)}
function dragTick(){if(!drag)return;const bw=$('#bw'),d=drag,W=innerWidth,E=56;
  if(bw){const r=bw.getBoundingClientRect(),v=W<860?9:16;if(d.x<Math.max(E,r.left+E))bw.scrollLeft-=v;else if(d.x>W-E)bw.scrollLeft+=v}
  const list=d.ph&&d.ph.parentElement;if(list&&list.classList.contains('col-list')){const r=list.getBoundingClientRect();if(d.y<r.top+40)list.scrollTop-=10;else if(d.y>r.bottom-40)list.scrollTop+=10}
  placeDrag()}
function endDrag(){const d=drag;clearInterval(d.tick);
  const list=d.ph.parentElement;let n=d.ph.nextElementSibling;while(n&&n.classList.contains('dragging'))n=n.nextElementSibling;
  const colId=list&&list.dataset.col,before=n&&n.classList.contains('card')?n.dataset.id:null;
  d.ghost.remove();d.ph.remove();d.card.classList.remove('dragging');document.body.classList.remove('is-dragging');drag=null;
  suppressClick=true;setTimeout(()=>suppressClick=false,60);
  if(colId)moveNote(spaceById(d.sid),d.id,colId,before);else renderContent();applyExternal()}
function cancelDrag(){const d=drag;clearInterval(d.tick);d.ghost.remove();d.ph.remove();d.card.classList.remove('dragging');document.body.classList.remove('is-dragging');drag=null;renderContent()}
document.addEventListener('pointermove',e=>{if(!drag||drag.touch)return;drag.x=e.clientX;drag.y=e.clientY;if(!drag.started){if(Math.hypot(drag.x-drag.sx,drag.y-drag.sy)>5)startDrag();return}placeDrag()});
document.addEventListener('pointerup',()=>{if(!drag||drag.touch)return;if(drag.started)endDrag();else drag=null});
document.addEventListener('touchmove',e=>{if(!drag)return;const t=e.touches[0];drag.x=t.clientX;drag.y=t.clientY;
  if(!drag.started){if(Math.hypot(drag.x-drag.sx,drag.y-drag.sy)>8){clearTimeout(drag.timer);drag=null}return}
  e.preventDefault();placeDrag()},{passive:false});
document.addEventListener('touchend',()=>{if(!drag)return;clearTimeout(drag.timer);if(drag.started)endDrag();else drag=null});
document.addEventListener('touchcancel',()=>{if(!drag)return;clearTimeout(drag.timer);if(drag.started)cancelDrag();else drag=null});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&drag&&drag.started)cancelDrag()});

/* ============ Pinnwand, Archiv, Heute ============ */
function renderWall(el){const s=sp(),notes=live(s).filter(n=>matches(s,n)).sort((a,b)=>(b.pinned-a.pinned)||b.updated.localeCompare(a.updated));
  el.innerHTML=`<div class="scroll wall-wrap" id="bw">${notes.length?`<div class="wall">${notes.map(n=>cardHTML(s,n,{showCol:true,wall:true})).join('')}</div>`:`<div class="empty-big">${live(s).length?'Keine Notiz passt zu den Filtern.':'Noch keine Notizen. Mit „+ Notiz“ oder der Taste N legst du die erste an.'}</div>`}</div>`;
  bindCards(el)}
function renderArchive(el){const s=sp(),notes=s.notes.filter(n=>n.archived).sort((a,b)=>b.updated.localeCompare(a.updated));
  el.innerHTML=`<div class="scroll wall-wrap" id="bw">${notes.length?`<div class="row-btns" style="margin:4px 0 14px"><span class="muted">${notes.length} archivierte Notiz${notes.length===1?'':'en'} – sie erscheinen nicht auf dem Board.</span><span class="spacer"></span><button class="btn sm danger" id="purgeAll">Archiv leeren …</button></div><div class="wall">${notes.map(n=>cardHTML(s,n,{showCol:true,wall:true,archive:true,ro:true})).join('')}</div>`:'<div class="empty-big">Das Archiv ist leer. Notizen archivierst du im Editor über „Archivieren“.</div>'}</div>`;
  bindCards(el);
  $$('[data-restore]',el).forEach(b=>b.onclick=e=>{e.stopPropagation();const n=byId(s,b.dataset.restore);n.archived=false;n.order=maxOrder(s,n.colId)+1;n.updated=now();save();render();toast('Notiz wiederhergestellt')});
  $$('[data-purge]',el).forEach(b=>b.onclick=e=>{e.stopPropagation();const snap=JSON.stringify(DB);s.notes=s.notes.filter(n=>n.id!==b.dataset.purge);save();render();toast('Notiz gelöscht',{undo:snap})});
  const pa=$('#purgeAll',el);if(pa)pa.onclick=async()=>{const r=await ask({title:'Archiv leeren?',text:`${notes.length} archivierte Notizen werden endgültig gelöscht.`,ok:'Alle löschen',danger:true});if(!r)return;const snap=JSON.stringify(DB);s.notes=s.notes.filter(n=>!n.archived);save();render();toast('Archiv geleert',{undo:snap})}}
function renderToday(el){const t=today(),end=addDays(t,7),L=[];
  for(const{s,n}of allNotes())if(!isDone(s,n))L.push({s,n});
  const by=(f)=>L.filter(f).sort((a,b)=>(a.n.due+(a.n.dueTime||'99')).localeCompare(b.n.due+(b.n.dueTime||'99'))||PRANK(a.n.prio)-PRANK(b.n.prio));
  const secs=[['Überfällig',by(x=>x.n.due&&dueState(x.s,x.n)==='late'),'late'],['Heute',by(x=>x.n.due===t&&dueState(x.s,x.n)!=='late'),''],['Morgen',by(x=>x.n.due===addDays(t,1)),''],
    ['Nächste 7 Tage',by(x=>x.n.due>addDays(t,1)&&x.n.due<=end),''],['Angeheftet',L.filter(x=>x.n.pinned&&!(x.n.due&&x.n.due<=end)),'']];
  const run=runningTimer();
  const todayMin=allNotes().reduce((a,{n})=>a+n.time.filter(x=>x.day===t).reduce((b,x)=>b+x.min,0),0);
  let html=`<div class="tsum"><div class="kpi"><div class="kpi-n">${secs[0][1].length}</div><div class="kpi-l">Überfällig</div></div><div class="kpi"><div class="kpi-n">${secs[1][1].length}</div><div class="kpi-l">Heute fällig</div></div><div class="kpi"><div class="kpi-n">${secs[3][1].length+secs[2][1].length}</div><div class="kpi-l">Bis in 7 Tagen</div></div><div class="kpi"><div class="kpi-n">${hm(todayMin)}</div><div class="kpi-l">Heute erfasst${run?' · Timer läuft':''}</div></div></div>`;
  let any=false;
  for(const[name,list,cls]of secs){if(!list.length)continue;any=true;
    html+=`<div class="sec-title${cls?' '+cls:''}">${name}<span class="badge soft">${list.length}</span></div><div class="wall">${list.map(x=>cardHTML(x.s,x.n,{showSpace:true,showCol:true,wall:true})).join('')}</div>`}
  if(!any)html+='<div class="empty-big">Keine Termine in den nächsten 7 Tagen und nichts angeheftet. Termine setzt du im Editor einer Notiz.</div>';
  el.innerHTML=`<div class="scroll wall-wrap" id="bw">${html}</div>`;bindCards(el)}

/* ============ Editor ============ */
function createNote(sid,colId,tpl){const s=spaceById(sid)||sp();const n=newNote(s,{colId:colId||firstOpenCol(s).id});n._new=true;if(tpl)applyTpl(n,tpl);openNote(s.id,n.id)}
function applyTpl(n,t){t.tags.forEach(ensureLabel);n.title=fillVars(t.title);n.body=fillVars(t.body);n.color=t.color;n.tags=[...new Set([...n.tags,...t.tags])];n.checklist=t.checklist.map(x=>ck(fillVars(x)));n.updated=now()}
async function addImages(files,n,after){
  for(const f of files){if(!/^image\//.test(f.type))continue;
    try{const data=await shrink(f);n.images.push({id:uid(),data,name:f.name||'Bild'});n.updated=now()}catch(e){toast('Bild konnte nicht gelesen werden')}}
  after()}
function shrink(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const src=fr.result;
  if(file.size<350000&&/png|gif|webp/.test(file.type)){res(src);return}
  const im=new Image();im.onerror=rej;im.onload=()=>{const M=1600,k=Math.min(1,M/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.85))};im.src=src};fr.readAsDataURL(file)})}
function lightbox(src){const d=$('#lightbox');d.innerHTML=`<img src="${src}" alt="Bild">`;d.onclick=()=>d.close();d.showModal()}

/* ============ Spalten & Spaces ============ */
async function renameCol(s,c){if(!c)return;const r=await ask({title:'Spalte umbenennen',fields:[{name:'n',label:'Name',value:c.name,required:true,maxlength:40}],ok:'Speichern'});if(!r)return;c.name=r.n.trim()||c.name;save();render()}
async function addCol(){const s=sp();const r=await ask({title:'Spalte hinzufügen',fields:[{name:'n',label:'Name',required:true,maxlength:40,placeholder:'z. B. Warten auf Kunde'},{name:'c',label:'Farbe',type:'select',options:NCOL.map(c=>[c.id,c.n]),value:'grey'},{name:'d',label:'Notizen in dieser Spalte gelten als …',type:'select',options:[['0','offen'],['1','erledigt (zählt nicht als fällig, startet Wiederholungen)']]}],ok:'Hinzufügen'});
  if(!r)return;const nc={id:uid(),name:r.n.trim(),color:r.c,done:r.d==='1'};const di=s.columns.findIndex(c=>c.done);if(!nc.done&&di>=0)s.columns.splice(di,0,nc);else s.columns.push(nc);save();render()}
async function deleteCol(s,c){
  if(s.columns.length<2){toast('Ein Space braucht mindestens eine Spalte.');return}
  const aff=s.notes.filter(n=>n.colId===c.id),others=s.columns.filter(x=>x!==c);
  const r=await ask({title:`Spalte „${c.name}“ löschen?`,text:aff.length?`<b>${aff.length}</b> Notizen liegen in dieser Spalte. Wohin sollen sie?`:'Die Spalte ist leer.',fields:aff.length?[{name:'to',label:'Verschieben nach',type:'select',options:others.map(x=>[x.id,x.name])}]:[],ok:'Löschen',danger:true});
  if(!r)return;const snap=JSON.stringify(DB),to=r.to||others[0].id;let o=maxOrder(s,to)+1;aff.forEach(n=>{n.colId=to;n.order=o++});s.columns=others;save();render();toast(`Spalte „${c.name}“ gelöscht`,{undo:snap})}
async function createSpace(folder){
  if(typeof folder!=='string')folder='';
  const r=await ask({title:'Space erstellen',text:'Ein Space ist ein eigenes Board mit eigenen Spalten und Notizen – z. B. pro Kunde, Projekt oder für die Schule.',
    fields:[{name:'name',label:'Name',required:true,maxlength:60,placeholder:'z. B. Kunde Muster AG'},{name:'tpl',label:'Vorlage',type:'select',options:Object.entries(TEMPLATES).map(([k,t])=>[k,`${t.n} – ${t.d}`])},{name:'color',label:'Farbe',type:'select',options:SPCOL.map((c,k)=>[c,SPCOLN[k]]),value:SPCOL[DB.spaces.length%SPCOL.length]},{name:'folder',label:'Kategorie',type:'select',options:folderOptions(),value:folder}],ok:'Erstellen'});
  if(!r)return;const s=makeSpace(r.name.trim(),r.color,r.tpl);s.folder=r.folder;expandTo(s.folder);DB.spaces.push(s);DB.ui.view='board';goSpace(s.id);save();toast(`Space „${s.name}“ erstellt`)}
async function deleteSpace(s){
  if(DB.spaces.length<2){toast('Der letzte Space kann nicht gelöscht werden.');return}
  const r=await ask({title:`Space „${s.name}“ löschen?`,text:`Alle <b>${s.notes.length}</b> Notizen werden gelöscht, auch archivierte und erfasste Zeiten. Tippe zur Bestätigung den Namen ein.`,fields:[{name:'k',label:'Name des Space',required:true}],ok:'Endgültig löschen',danger:true,
    init:f=>{const k=f.elements.k;const c=()=>k.setCustomValidity(k.value.trim()===s.name.trim()?'':'Name stimmt nicht überein');k.addEventListener('input',c);c()}});
  if(!r)return;const snap=JSON.stringify(DB);DB.spaces=DB.spaces.filter(x=>x!==s);DB.active=DB.spaces[0].id;DB.ui.view='board';save();render();toast(`Space „${s.name}“ gelöscht`,{undo:snap})}
function renderSpaceCfg(el){const s=sp(),tab=ui.stab;let body='';
  if(tab==='details')body=`<div class="panel"><h3>Space</h3><form id="sf" class="form">
    <div class="fld"><label for="sfName">Name</label><input id="sfName" name="name" required maxlength="60" value="${esc(s.name)}"></div>
    <div class="fld"><label>Farbe</label><div class="swatches">${SPCOL.map((c,k)=>`<button type="button" class="sw${c===s.color?' on':''}" style="background:${c}" data-c="${c}" title="${SPCOLN[k]}" aria-label="${SPCOLN[k]}"></button>`).join('')}</div></div>
    <div class="fld"><label for="sfFolder">Kategorie</label><select id="sfFolder" name="folder">${folderOptions().map(([v,l])=>`<option value="${v}"${v===s.folder?' selected':''}>${esc(l)}</option>`).join('')}</select></div>
    <div class="fld"><label for="sfDesc">Beschreibung</label><textarea id="sfDesc" name="desc" rows="3">${esc(s.desc)}</textarea></div>
    <button class="btn primary">Speichern</button></form></div>
    <div class="panel"><h3>Exportieren</h3><p class="muted">Alle Notizen dieses Space als Dokument – zum Ablegen, Weitergeben oder als PDF.</p><div class="row-btns"><button class="btn" id="prSp">Drucken / PDF</button><button class="btn" id="mdSp">Markdown (.md)</button><button class="btn" id="jsSp">JSON</button></div></div>

/* ============ Zeiterfassung (Bericht) ============ */
function periodRange(p){const t=today(),d=dow(t),mon=addDays(t,-((d+6)%7));
  switch(p){case'today':return[t,t,'Heute'];case'yesterday':return[addDays(t,-1),addDays(t,-1),'Gestern'];
    case'week':return[mon,addDays(mon,6),'Diese Woche (KW '+isoWeek(t)+')'];case'lastweek':return[addDays(mon,-7),addDays(mon,-1),'Letzte Woche (KW '+isoWeek(addDays(mon,-7))+')'];
    case'month':return[t.slice(0,8)+'01',t,new Date(t+'T12:00').toLocaleDateString('de-CH',{month:'long',year:'numeric'})];
    case'lastmonth':{const[y,m]=t.split('-').map(Number);const py=m===1?y-1:y,pm=m===1?12:m-1,last=new Date(py,pm,0).getDate(),a=`${py}-${String(pm).padStart(2,'0')}-01`;return[a,`${py}-${String(pm).padStart(2,'0')}-${last}`,new Date(a+'T12:00').toLocaleDateString('de-CH',{month:'long',year:'numeric'})]}
    default:return['0000-01-01','9999-12-31','Alle Einträge']}}
function timeRows(p){const[a,b]=periodRange(p),rows=[];
  for(const{s,n}of allNotes())for(const t of n.time)if(t.day>=a&&t.day<=b)rows.push({s,n,t});
  rows.sort((x,y)=>y.t.day.localeCompare(x.t.day)||(y.t.start||'').localeCompare(x.t.start||''));return rows}
function renderTime(el){const p=ui.period,[a,b,label]=periodRange(p),rows=timeRows(p),tot=rows.reduce((x,r)=>x+r.t.min,0);
  const days=[...new Set(rows.map(r=>r.t.day))];const perNote={};rows.forEach(r=>{const k=r.s.id+'/'+r.n.id;(perNote[k]=perNote[k]||{s:r.s,n:r.n,min:0}).min+=r.t.min});
  const top=Object.values(perNote).sort((x,y)=>y.min-x.min);const run=runningTimer();
  el.innerHTML=`<div class="scroll" id="bw"><div class="page wide">
  <div class="row-btns" style="margin-bottom:14px"><select id="per" aria-label="Zeitraum">${[['today','Heute'],['yesterday','Gestern'],['week','Diese Woche'],['lastweek','Letzte Woche'],['month','Dieser Monat'],['lastmonth','Letzter Monat'],['all','Alle']].map(([k,n])=>`<option value="${k}"${p===k?' selected':''}>${n}</option>`).join('')}</select><span class="muted">${esc(label)}${p!=='all'?' · '+fmtDate(a)+(a!==b?' – '+fmtDate(b):''):''}</span><span class="spacer"></span><button class="btn" id="tCsv"${rows.length?'':' disabled'}>CSV für Excel</button><button class="btn" id="tPrint"${rows.length?'':' disabled'}>Drucken / PDF</button></div>
  <div class="tsum"><div class="kpi"><div class="kpi-n">${hm(tot)}</div><div class="kpi-l">Stunden total</div></div><div class="kpi"><div class="kpi-n">${(tot/60).toFixed(2)}</div><div class="kpi-l">Dezimal-Stunden</div></div><div class="kpi"><div class="kpi-n">${rows.length}</div><div class="kpi-l">Einträge</div></div><div class="kpi"><div class="kpi-n">${top.length}</div><div class="kpi-l">Notizen</div></div></div>
  ${run?`<div class="panel" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><span>Läuft gerade: <b>${esc(noteLabel(run.n))}</b> · ${esc(run.s.name)}</span><span class="spacer"></span><button class="btn ok sm" data-act="stopRun">■ Stoppen</button></div>`:''}
  ${rows.length?`<div class="panel"><h3>Einträge</h3><div class="tbl-wrap"><table class="ttable"><thead><tr><th>Notiz</th><th>Space</th><th>Beschreibung</th><th class="r">Dauer</th></tr></thead><tbody>
    ${days.map(d=>{const dr=rows.filter(r=>r.t.day===d),dt=dr.reduce((x,r)=>x+r.t.min,0);return`<tr class="day"><td colspan="3">${WD[dow(d)]}, ${fmtDate(d)}</td><td class="r">${hm(dt)}</td></tr>`+dr.map(r=>`<tr class="clk" data-sid="${r.s.id}" data-nid="${r.n.id}"><td>${esc(noteLabel(r.n))}</td><td class="muted">${esc(r.s.name)}</td><td class="muted">${esc(r.t.text)||(r.t.start?new Date(r.t.start).toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'})+'–'+new Date(r.t.end).toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'}):'')}</td><td class="r">${hm(r.t.min)}</td></tr>`).join('')}).join('')}
    </tbody></table></div></div>
    <div class="panel"><h3>Nach Notiz</h3><div class="tbl-wrap"><table class="ttable"><tbody>${top.map(x=>`<tr class="clk" data-sid="${x.s.id}" data-nid="${x.n.id}"><td>${esc(noteLabel(x.n))}</td><td class="muted">${esc(x.s.name)}</td><td>${x.n.tags.map(lblHTML).join(' ')}</td><td class="r">${hm(x.min)}</td></tr>`).join('')}</tbody></table></div></div>`
    :`<div class="empty-big">Keine Zeiten im gewählten Zeitraum. Starte die Zeiterfassung mit ▶ auf einer Notiz oder erfasse Zeit im Editor.</div>`}
  <p class="muted sm">Rundung beim Stoppen: ${DB.settings.round?'auf '+DB.settings.round+' Minuten aufrunden':'keine'} – änderbar unter Einstellungen.</p></div></div>`;
  $('#per',el).onchange=e=>{ui.period=e.target.value;renderContent()};
  $$('tr.clk',el).forEach(r=>r.onclick=()=>openNote(r.dataset.sid,r.dataset.nid));
  $('#tCsv',el).onclick=()=>{const q=v=>{v=String(v??'');return/[";\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
    const lines=[['Datum','Space','Notiz','Labels','Beschreibung','Start','Ende','Minuten','Stunden'].join(';'),...[...rows].reverse().map(r=>[fmtDate(r.t.day),r.s.name,noteLabel(r.n),r.n.tags.join(', '),r.t.text,r.t.start?new Date(r.t.start).toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'}):'',r.t.end?new Date(r.t.end).toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'}):'',r.t.min,(r.t.min/60).toFixed(2).replace('.',',')].map(q).join(';'))];
    download(`zeiterfassung-${a===b?a:a+'_'+b}.csv`.replace('0000-01-01_9999-12-31','alle'),'﻿'+lines.join('\r\n'),'text/csv;charset=utf-8')};
  $('#tPrint',el).onclick=()=>printTime(p)}

/* ============ Drucken / PDF ============ */
function printNoteHTML(s,n,showSpace){const col=colOf(s,n);
  const meta=[showSpace?s.name:'',col.name,n.due?'Termin '+fmtDate(n.due)+(n.dueTime?' '+n.dueTime:''):'',n.prio?'Priorität '+PRIO[n.prio].n:'',n.tags.length?n.tags.join(', '):'',n.time.length?'Zeit '+hShort(timeTotal(n)):''].filter(Boolean).join(' · ');
  return`<div class="pn"><h3>${esc(noteLabel(n))}</h3>${meta?`<div class="pm">${esc(meta)}</div>`:''}${n.body.trim()?`<div class="md">${md(n.body)}</div>`:''}${n.checklist.length?`<ul class="pck">${n.checklist.map(c=>`<li class="${c.done?'done':''}">${esc(c.text)}</li>`).join('')}</ul>`:''}${n.images.map(i=>`<img src="${i.data}" alt="">`).join('')}</div>`}
function doPrint(html){const pa=$('#printArea');pa.innerHTML=html;setTimeout(()=>{window.print();setTimeout(()=>pa.innerHTML='',500)},60)}
function printNotes(title,list,single){doPrint(`<h1>${esc(title)}</h1><div class="pmeta">Gedruckt am ${fmtTime(now())}</div>${list.map(x=>printNoteHTML(x.s,x.n,!single)).join('')}`)}
function printSpace(s){let h=`<h1>${esc(s.name)}</h1><div class="pmeta">${s.desc?esc(s.desc)+' · ':''}Stand ${fmtTime(now())}</div>`;
  s.columns.forEach(c=>{const l=live(s).filter(n=>n.colId===c.id).sort(dispSort);if(l.length)h+=`<h2>${esc(c.name)}</h2>`+l.map(n=>printNoteHTML(s,n)).join('')});doPrint(h)}
function printTime(p){const[a,b,label]=periodRange(p),rows=timeRows(p),tot=rows.reduce((x,r)=>x+r.t.min,0),days=[...new Set(rows.map(r=>r.t.day))].sort();
  doPrint(`<h1>Zeiterfassung</h1><div class="pmeta">${esc(label)}${p!=='all'?' · '+fmtDate(a)+' – '+fmtDate(b):''} · Total ${hm(tot)} h (${(tot/60).toFixed(2)})</div><table><thead><tr><th>Notiz</th><th>Space</th><th>Beschreibung</th><th class="r">Dauer</th></tr></thead><tbody>${days.map(d=>{const dr=rows.filter(r=>r.t.day===d).reverse();return`<tr class="day"><td colspan="3">${WD[dow(d)]}, ${fmtDate(d)}</td><td class="r">${hm(dr.reduce((x,r)=>x+r.t.min,0))}</td></tr>`+dr.map(r=>`<tr><td>${esc(noteLabel(r.n))}</td><td>${esc(r.s.name)}</td><td>${esc(r.t.text)}</td><td class="r">${hm(r.t.min)}</td></tr>`).join('')}).join('')}</tbody></table>`)}
function exportMd(s){const L=[`# ${s.name}`,''];if(s.desc)L.push(s.desc,'');
  const sec=(name,list)=>{if(!list.length)return;L.push(`## ${name}`,'');list.forEach(n=>{L.push(noteText(s,n).replace(/^# /,'### '),'')})};
  s.columns.forEach(c=>sec(c.name,live(s).filter(n=>n.colId===c.id).sort(dispSort)));sec('Archiv',s.notes.filter(n=>n.archived));
  download(`${safeName(s.name)}-${today()}.md`,L.join('\n'),'text/markdown')}
