<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f5bd3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Notizen">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Kanban Notizen</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <div class="scrim" data-act="menu"></div>
  <div class="main">
    <div class="banner" id="banner" hidden></div>
    <header class="head" id="head"></header>
    <div class="fbar" id="fbar"></div>
    <div class="content" id="content"></div>
    <nav class="tabbar" id="tabbar" aria-label="Navigation"></nav>
  </div>
</div>
<dialog id="dlg"></dialog>
<dialog id="dlg2" class="small"></dialog>
<dialog id="pal"></dialog>
<dialog id="lightbox"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<div id="printArea"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<input type="file" id="imgIn" accept="image/*" multiple hidden>
<script src="js/core.js"></script>
<script src="js/model.js"></script>
<script src="js/storage.js"></script>
<script src="js/helpers.js"></script>
<script src="js/tasks.js"></script>
<script src="js/layout.js"></script>
<script src="js/board.js"></script>
<script src="js/views.js"></script>
<script src="js/editor.js"></script>
<script src="js/spaces.js"></script>
<script src="js/reports.js"></script>
<script src="js/settings.js"></script>
<script src="js/palette.js"></script>
<script src="js/links.js"></script>
<script src="js/trash.js"></script>
<script src="js/main.js"></script>
</body>
</html>
