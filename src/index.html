  const on=(id,f)=>{const x=$('#'+id,el);if(x)x.onclick=f};
  if(tab==='general'){on('uCheck',()=>checkUpdate(true));on('uInstall',installUpdate);on('tReveal',()=>tInvoke('reveal_data').catch(e=>toast('Ordner konnte nicht geöffnet werden: '+e)));on('tNew',tauriNewFile);on('tOpen',tauriOpenFile);on('tReset',tauriResetPath);on('sNew',pickNewFile);on('sOpen',pickExistingFile);on('sDisc',disconnectFile);on('sGrant',grantFile);
    $$('[data-theme]',el).forEach(b=>b.onclick=()=>{S.theme=b.dataset.theme;applyTheme();save(true);renderContent()});
    $('#sNotify',el).onchange=async e=>{if(e.target.checked&&'Notification' in window){let p=Notification.permission;if(p==='default')p=await Notification.requestPermission();if(p!=='granted'){e.target.checked=false;toast('Benachrichtigungen wurden nicht erlaubt');return}}S.notify=e.target.checked;save(true);toast(S.notify?'Benachrichtigungen aktiviert':'Benachrichtigungen aus')};
    $('#sRound',el).onchange=e=>{S.round=+e.target.value;save(true);toast('Gespeichert')};
    on('sJiraSave',()=>{let v=$('#sJira',el).value.trim();if(v&&!/^https?:\/\//i.test(v)){toast('Bitte eine Adresse mit https:// eingeben');return}S.jiraUrl=v;save();render();toast(v?'Jira-Verknüpfung gespeichert':'Jira-Verknüpfung ausgeschaltet')})}
  else if(tab==='tpl'){$$('.tpl-row',el).forEach(r=>{const t=S.templates.find(x=>x.id===r.dataset.tid);
      $('[data-edit]',r).onclick=()=>editTpl(t);$('[data-up]',r).onclick=()=>{moveArr(S.templates,t,-1);save(true);renderContent()};$('[data-down]',r).onclick=()=>{moveArr(S.templates,t,1);save(true);renderContent()};
      $('[data-del]',r).onclick=()=>{const snap=JSON.stringify(DB);S.templates=S.templates.filter(x=>x!==t);save(true);renderContent();toast('Vorlage gelöscht',{undo:snap})}});
    on('tplNew',()=>editTpl(null));
    on('tplReset',()=>{const have=new Set(S.templates.map(t=>t.name));const add=DEFAULT_TPL().filter(t=>!have.has(t.name));S.templates.push(...add);save(true);renderContent();toast(add.length?add.length+' Vorlagen ergänzt':'Alle Standardvorlagen sind schon vorhanden')})}
  else{on('bAll',()=>{backupAll();toast('Backup heruntergeladen')});on('bRestore',()=>{fileMode='all';$('#fileIn').click()});on('bImport',()=>{fileMode='add';$('#fileIn').click()});
    on('bReset',async()=>{const r=await ask({title:'Alles zurücksetzen?',text:'Tippe <b>LÖSCHEN</b> ein, um alle Notizen zu entfernen.',fields:[{name:'k',label:'Bestätigung',required:true}],ok:'Alles löschen',danger:true,init:f=>{const k=f.elements.k;const c=()=>k.setCustomValidity(k.value.trim().toUpperCase()==='LÖSCHEN'?'':'Bitte LÖSCHEN eingeben');k.addEventListener('input',c);c()}});
      if(!r)return;const snap=JSON.stringify(DB);DB=normDB({ui:{view:'board'},settings:DB.settings});ui.filters=blankF();save();render();toast('Alles zurückgesetzt',{undo:snap})})}}
async function editTpl(t){const isNew=!t;t=t||{id:uid(),name:'',color:'default',title:'',body:'',tags:[],checklist:[]};
  const r=await ask({title:isNew?'Vorlage erstellen':'Vorlage bearbeiten',wide:true,fields:[{name:'name',label:'Name',value:t.name,required:true,maxlength:40},{name:'title',label:'Titel der Notiz',value:t.title,placeholder:'z. B. Kundentermin {datum}'},
    {name:'body',label:'Text',type:'textarea',rows:8,value:t.body},{name:'ck',label:'Checkliste (ein Punkt pro Zeile)',type:'textarea',rows:4,value:t.checklist.join('\n')},{name:'tags',label:'Labels (mit Komma trennen)',value:t.tags.join(', ')},{name:'color',label:'Farbe',type:'select',options:NCOL.map(c=>[c.id,c.n]),value:t.color}],ok:'Speichern'});
  if(!r)return;Object.assign(t,{name:r.name.trim(),title:r.title,body:r.body,checklist:r.ck.split('\n').map(x=>x.trim()).filter(Boolean),tags:r.tags.split(',').map(x=>x.trim()).filter(Boolean),color:r.color});t.tags.forEach(ensureLabel);
  if(isNew)DB.settings.templates.push(t);save(true);renderContent();toast('Vorlage gespeichert')}

/* ============ Import ============ */
let fileMode='all';
$('#fileIn').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;
  let d;try{d=JSON.parse(await file.text())}catch(_){toast('Die Datei ist kein gültiges JSON.');return}
  const snap=JSON.stringify(DB);
  try{
    let spaces;
    if(d&&d.kind==='space'&&d.space)spaces=[d.space];
    else if(d&&Array.isArray(d.columns)&&Array.isArray(d.issues))spaces=[fromV1(d)].filter(Boolean);
    else if(d&&Array.isArray(d.spaces))spaces=d.spaces.map(s=>arr(s.columns).length||!arr(s.statuses).length?normSpace(s):fromV2(Object.assign({},s,{desc:''}))).filter(Boolean);
    else throw new Error('Unbekanntes Dateiformat');
    if(!spaces.length)throw new Error('Die Datei enthält keine Notizen');
    const conv=spaces.map(normSpace);
    if(fileMode==='all'){const r=await ask({title:'Backup wiederherstellen?',text:`Die Datei enthält ${conv.length} Space${conv.length===1?'':'s'} mit ${conv.reduce((a,s)=>a+s.notes.length,0)} Notizen. Alle aktuellen Notizen werden ersetzt.`,ok:'Wiederherstellen',danger:true});if(!r)return;
      DB=normDB({folders:d.folders,spaces:conv.map((x,k)=>Object.assign(x,{folder:(spaces[k]||{}).folder||''})),settings:d.settings||DB.settings,ui:{view:'board'}});applyTheme();toast('Backup wiederhergestellt',{undo:snap})}
    else{conv.forEach(s=>{s.id=uid();s.folder='';s.notes.forEach(n=>n.id=uid());DB.spaces.push(s)});DB.active=conv[conv.length-1].id;DB.ui.view='board';toast(`${conv.length} Space${conv.length===1?'':'s'} importiert`,{undo:snap})}
    ui.filters=blankF();save();render()}
  catch(err){DB=normDB(JSON.parse(snap));toast('Import fehlgeschlagen: '+err.message)}};

/* ============ Suche & Befehle (Strg+K) ============ */
function openPalette(){const d=$('#pal');let sel=0,items=[];
  d.innerHTML='<input class="pal-in" id="palIn" placeholder="Notizen durchsuchen oder Befehl eingeben …" autocomplete="off" aria-label="Suche"><div class="pal-list" id="palList" role="listbox"></div><div class="pal-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> auswählen</span><span><kbd>Enter</kbd> öffnen</span><span><kbd>Esc</kbd> schliessen</span></div>';
  const inp=$('#palIn',d),list=$('#palList',d);
  const cmds=()=>{const s=sp();return[
    {sec:'Befehle',i:'+',t:`Neue Notiz in „${s.name}“`,run:()=>createNote(s.id)},
    ...DB.settings.templates.map(t=>({sec:'Befehle',i:'+',t:`Neue Notiz aus Vorlage: ${t.name}`,run:()=>createNote(s.id,null,t)})),
    {sec:'Befehle',i:'⏱',t:runningTimer()?'Zeiterfassung stoppen':'Zeiterfassung öffnen',run:()=>{const r=runningTimer();r?stopTimer(r.s,r.n):setView('time')}},
    {sec:'Gehe zu',i:'›',t:'Heute & Termine',run:()=>setView('today')},{sec:'Gehe zu',i:'›',t:'Zeiterfassung',run:()=>setView('time')},{sec:'Gehe zu',i:'›',t:'Einstellungen',run:()=>setView('settings')},
    ...DB.spaces.map(x=>({sec:'Gehe zu',i:'›',t:'Space: '+spaceLabel(x),run:()=>goSpace(x.id)})),
    {sec:'Befehle',i:'+',t:'Kategorie erstellen',run:()=>createFolder('')},
    {sec:'Befehle',i:'↓',t:'Backup herunterladen',run:()=>{backupAll();toast('Backup heruntergeladen')}},{sec:'Befehle',i:'⎙',t:`Space „${s.name}“ drucken / PDF`,run:()=>printSpace(s)}]};
  const draw=()=>{const q=inp.value.trim().toLowerCase();
    const notes=[];for(const{s,n}of allNotes()){const hay=[n.title,n.body,n.tags.join(' '),n.checklist.map(c=>c.text).join(' ')].join('\n').toLowerCase();if(!q||hay.includes(q))notes.push({s,n,score:(n.title.toLowerCase().includes(q)?2:0)+(n.archived?-3:0)+(isDone(s,n)?-1:0)})}
    notes.sort((a,b)=>b.score-a.score||b.n.updated.localeCompare(a.n.updated));
    const cm=cmds().filter(c=>!q||c.t.toLowerCase().includes(q));
    items=[...(q?notes.slice(0,30).map(x=>({sec:'Notizen',i:'▤',t:noteLabel(x.n),sub:spaceLabel(x.s)+(x.n.archived?' · Archiv':isDone(x.s,x.n)?' · erledigt':''),run:()=>openNote(x.s.id,x.n.id)})):[]),...cm.slice(0,q?8:20),...(!q?notes.slice(0,8).map(x=>({sec:'Zuletzt geändert',i:'▤',t:noteLabel(x.n),sub:x.s.name,run:()=>openNote(x.s.id,x.n.id)})):[])];
    sel=Math.min(sel,Math.max(0,items.length-1));let last='';
    list.innerHTML=items.map((it,k)=>{const h=it.sec!==last?`<div class="pal-sec">${it.sec}</div>`:'';last=it.sec;return h+`<div class="pal-it${k===sel?' on':''}" data-k="${k}" role="option"><span class="pi">${it.i}</span><span class="pt">${esc(it.t)}</span>${it.sub?`<span class="ps">${esc(it.sub)}</span>`:''}</div>`}).join('')||'<div class="empty-big" style="padding:24px">Nichts gefunden.</div>';
    $$('.pal-it',list).forEach(x=>{x.onclick=()=>go(+x.dataset.k);x.onmousemove=()=>{if(sel!==+x.dataset.k){sel=+x.dataset.k;$$('.pal-it',list).forEach(y=>y.classList.toggle('on',y===x))}}})};
  const go=k=>{const it=items[k];if(!it)return;d.close();setTimeout(()=>it.run(),0)};
  inp.oninput=()=>{sel=0;draw()};
  inp.onkeydown=e=>{if(e.key==='ArrowDown'){e.preventDefault();sel=Math.min(items.length-1,sel+1);draw();$('.pal-it.on',list)?.scrollIntoView({block:'nearest'})}
    else if(e.key==='ArrowUp'){e.preventDefault();sel=Math.max(0,sel-1);draw();$('.pal-it.on',list)?.scrollIntoView({block:'nearest'})}
    else if(e.key==='Enter'){e.preventDefault();go(sel)}};
  d.onclick=e=>{if(e.target===d)d.close()};
  draw();d.showModal();inp.focus()}
function showHelp(){const K=(...k)=>'<span>'+k.map(x=>`<kbd>${x}</kbd>`).join(' + ')+'</span>';
  const rows=[[K('N'),'Neue Notiz im aktuellen Space'],[K('Strg','K'),'Alles durchsuchen und Befehle'],[K('/'),'Im aktuellen Space suchen'],[K('H'),'Heute & Termine'],[K('Z'),'Zeiterfassung'],[K('T'),'Laufende Zeit stoppen'],
    [K('1')+' … '+K('4'),'Board · Alle Notizen · Archiv · Space-Einstellungen'],[K('Esc'),'Editor schliessen – gespeichert wird automatisch'],[K('Strg','V'),'Im Editor: Screenshot einfügen'],[K('Enter'),'Im Text: Liste automatisch fortsetzen'],[K('?'),'Diese Übersicht']];
  ask({title:'Tastenkürzel',ok:'Schliessen',cancel:null,text:`<div class="keys">${rows.map(([k,t])=>k+`<span>${esc(t)}</span>`).join('')}</div>`})}

/* ============ Globale Ereignisse ============ */
const ACTIONS={newSpace:()=>createSpace(''),newFolder:()=>createFolder(''),addMenu:a=>{const[x,y]=menuAt(a);addMenu(x,y,'')},view:a=>setView(a.dataset.v),create:()=>createNote(sp().id),menu:()=>$('.app').classList.toggle('menu-open'),
  clearF:()=>{ui.filters=blankF();renderFbar();renderContent()},addCol:()=>addCol(),palette:()=>openPalette(),help:()=>showHelp(),
  checkUpdate:()=>checkUpdate(true),installUpdate:()=>installUpdate(),
  backupNow:()=>{backupAll();toast('Backup heruntergeladen')},
  openRun:()=>{const r=runningTimer();if(r)openNote(r.s.id,r.n.id)},stopRun:()=>{const r=runningTimer();if(r)stopTimer(r.s,r.n)}};
document.addEventListener('click',e=>{if(e.target.closest('dialog'))return;
  const tl=e.target.closest('[data-fadd],[data-fmenu],[data-smenu]');
  if(tl){e.stopPropagation();const[x,y]=menuAt(tl);if(tl.dataset.fadd)addMenu(x,y,tl.dataset.fadd);else if(tl.dataset.fmenu)folderMenu(folderById(tl.dataset.fmenu),x,y);else spaceMenu(spaceById(tl.dataset.smenu),x,y);return}
  const fo=e.target.closest('[data-folder]');if(fo){toggleFolder(fo.dataset.folder);return}
  const sb=e.target.closest('[data-space]');if(sb){goSpace(sb.dataset.space);return}
  const a=e.target.closest('[data-act]');if(a&&ACTIONS[a.dataset.act])ACTIONS[a.dataset.act](a,e)});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#ctx')){e.preventDefault();closeMenu();return}
  if((e.ctrlKey||e.metaKey)&&(e.key==='k'||e.key==='K')){e.preventDefault();if(!$('#pal').open&&!$('#dlg2').open){if($('#dlg').open)$('#dlg').close();openPalette()}return}
  if($('#dlg').open||$('#dlg2').open||$('#pal').open||$('#lightbox').open)return;
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable||e.ctrlKey||e.metaKey||e.altKey)return;
  const v=DB.ui.view,k=e.key.toLowerCase();
  if(k==='n'||k==='c'){e.preventDefault();createNote(sp().id)}
  else if(e.key==='/'){const q=$('#q');if(q){e.preventDefault();q.focus()}else{e.preventDefault();openPalette()}}
  else if(e.key==='?'){e.preventDefault();showHelp()}
  else if(k==='h')setView('today');else if(k==='z')setView('time');
  else if(k==='t'){const r=runningTimer();if(r)stopTimer(r.s,r.n)}
  else if(['1','2','3','4'].includes(e.key))setView(SPACE_VIEWS[+e.key-1])});

/* ============ Start ============ */
DB=loadLocal();applyTheme();render();
if(DB._migrated)save(true);
setStatus(tv.on?'Lade Notizen …':'Gespeichert im Browser');
(tv.on?tauriInit():initFile()).then(()=>{checkReminders();if(tv.on)return;if(!store.handle&&store.supported&&!fileMeta().hinted){setFileMeta({hinted:true});setTimeout(()=>toast('Tipp: Unter Einstellungen eine Speicherdatei wählen, z. B. in OneDrive.'),1200)}});
</script>
