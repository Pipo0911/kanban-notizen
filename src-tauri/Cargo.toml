[package]
name = "kanban-notizen"
version = "1.0.0"
description = "Kanban Notizen – Notizen, Termine und Zeiterfassung als Desktop-App"
authors = ["Philipp Seewer"]
edition = "2021"

[lib]
name = "kanban_notizen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
