# Veröffentlicht die Web-App (iPhone / Browser) auf GitHub Pages.
# Adresse: https://pipo0911.github.io/kanban-notizen/
# Einmalig nötig: Settings → Pages → Source: "GitHub Actions"
name: Web-App veröffentlichen

on:
  push:
    branches: [main]
    paths: ["src/**", "CHANGELOG.md", "tools/web-version.mjs", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Code holen
        uses: actions/checkout@v5

      - name: Version, Datum und Neuerungen eintragen
        run: |
          mkdir -p site && cp -r src/. site/
          node tools/web-version.mjs site "${GITHUB_SHA::7}"
          touch site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Veröffentlichen
        id: deploy
        uses: actions/deploy-pages@v4
