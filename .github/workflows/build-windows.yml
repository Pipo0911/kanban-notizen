# Baut den Windows-Installer automatisch auf einem Windows-Server von GitHub.
#  - bei jedem Push auf main: Installer als Download unter "Actions" → Lauf → "Artifacts"
#  - bei einem Tag wie v1.0.0: zusätzlich ein Release mit den Installern
name: Windows-Installer bauen

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust einrichten
        uses: dtolnay/rust-toolchain@stable

      - name: Rust-Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Abhängigkeiten installieren
        run: npm install

      - name: App und Installer bauen
        run: npx tauri build

      - name: Installer als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: KanbanNotizen-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Release erstellen (nur bei Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Kanban Notizen ${{ github.ref_name }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
