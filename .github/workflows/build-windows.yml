# Baut den Windows-Installer automatisch auf einem Windows-Server von GitHub.
#  - Push auf main mit NEUER Version in src-tauri/tauri.conf.json:
#      Release vX.Y.Z mit Installern + latest.json (automatisches Update)
#  - Push auf main ohne Versionsänderung: nur Testbuild unter "Actions" → "Artifacts"
#  - Tag wie v1.4.0 funktioniert ebenfalls
#
# Benötigte Secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
name: Windows-Installer bauen

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Code holen
        uses: actions/checkout@v5

      - name: Signatur-Schlüssel vorhanden?
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY fehlt – unter Settings → Secrets and variables → Actions eintragen."
            exit 1
          fi

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Version prüfen – Release nötig?
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"; echo "Release v$V existiert schon – nur Testbuild."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"; echo "Neue Version v$V – erstelle Release."
          fi

      - name: Rust einrichten
        uses: dtolnay/rust-toolchain@stable

      - name: Rust-Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Abhängigkeiten installieren
        run: npm install

      # --- Testbuild (Push auf main) ---
      - name: App und Installer bauen
        if: steps.ver.outputs.release != 'true'
        run: npx tauri build

      - name: Installer als Artefakt hochladen
        if: steps.ver.outputs.release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: KanbanNotizen-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      # --- Release (neue Version oder Tag) ---
      - name: Release mit Update-Dateien erstellen
        if: steps.ver.outputs.release == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ steps.ver.outputs.version }}
          releaseName: Kanban Notizen v${{ steps.ver.outputs.version }}
          releaseCommitish: ${{ github.sha }}
          releaseBody: |
            Installer: **Kanban Notizen_…_x64-setup.exe** herunterladen und ausführen.
            Bereits installiert? Die App meldet sich beim nächsten Start selbst mit dem Update.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
