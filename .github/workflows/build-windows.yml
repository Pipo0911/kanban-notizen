# Baut den Windows-Installer automatisch auf einem Windows-Server von GitHub.
#  - Push auf main: Testbuild, Installer unter "Actions" → Lauf → "Artifacts"
#  - Tag wie v1.2.0: Release mit Installern + latest.json für das automatische Update
#
# Benötigte Secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
name: Windows-Installer bauen

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Code holen
        uses: actions/checkout@v5

      - name: Signatur-Schlüssel vorhanden?
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY fehlt – unter Settings → Secrets and variables → Actions eintragen."
            exit 1
          fi

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Rust einrichten
        uses: dtolnay/rust-toolchain@stable

      - name: Rust-Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Abhängigkeiten installieren
        run: npm install

      # --- Testbuild (Push auf main) ---
      - name: App und Installer bauen
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx tauri build

      - name: Installer als Artefakt hochladen
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: KanbanNotizen-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      # --- Release (Tag v*) ---
      - name: Release mit Update-Dateien erstellen
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Kanban Notizen ${{ github.ref_name }}
          releaseBody: |
            Installer: **Kanban Notizen_…_x64-setup.exe** herunterladen und ausführen.
            Bereits installiert? Die App meldet sich beim nächsten Start selbst mit dem Update.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
